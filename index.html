<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>ระบบคำร้องขอเข้าห้องสอบ (สว.01)</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  :root{--primary:#10b981;--primary-dark:#059669;--secondary:#fbbf24;--bg:#f0fdf4;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:'Sarabun',sans-serif;background:var(--bg);margin:0;color:#1f2937}
  .btn-primary{background:var(--primary);color:#fff;transition:.2s}
  .btn-primary:hover{background:var(--primary-dark);transform:translateY(-1px);box-shadow:0 4px 12px rgba(16,185,129,.3)}
  .btn-primary:active{transform:translateY(0)}
  .text-primary{color:var(--primary)}
  .bg-primary{background:var(--primary)}
  .border-primary{border-color:var(--primary)}
  .skeleton{background:linear-gradient(90deg,#f0f0f0 25%,#e0e0e0 50%,#f0f0f0 75%);background-size:200% 100%;animation:sk 1.5s infinite;border-radius:8px}
  @keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
  .sidebar-item{transition:.15s;border-left:3px solid transparent}
  .sidebar-item:hover{background:#ecfdf5}
  .sidebar-item.active{background:var(--primary);color:#fff;border-left-color:var(--secondary)}
  .card{background:#fff;border-radius:16px;box-shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04)}
  .card-hover:hover{box-shadow:0 10px 25px rgba(0,0,0,.08);transform:translateY(-2px)}
  #sigCanvas{touch-action:none;background:#fff;border:2px dashed #cbd5e1;border-radius:12px;cursor:crosshair;width:100%;max-width:500px}
  .modal-backdrop{background:rgba(0,0,0,.5);backdrop-filter:blur(4px)}
  .fade-in{animation:fadeIn .3s ease}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  .table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .app-icon{transition:.15s}
  .app-icon:active{transform:scale(.92)}
  .mobile-nav{display:none}
  @media (max-width:1023px){.mobile-nav{display:flex}.sidebar-desktop{display:none}}
  @media print{.no-print{display:none!important}}
  .swal2-popup{font-family:'Sarabun',sans-serif!important;border-radius:16px!important}
  .focus-primary:focus{border-color:var(--primary);outline:none;box-shadow:0 0 0 3px rgba(16,185,129,.15)}
</style>
</head>
<body>
<div id="app"></div>

<script>
// ============================================================
// 🔧 ตั้งค่า API URL (สำหรับการรันผ่าน GitHub Pages)
// ============================================================
let API_URL = 'https://script.google.com/macros/s/AKfycbzAduHZzHrSZgPsjSGbSmCmG1FbLDV34cVQCDCz83P_886yBD0xWoVNPRpVP9C5qBCQ/exec';

// ============================================================
// CONSTANTS
// ============================================================
const MONTHS = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const ROLE_LABELS = {
  admin: 'ผู้ดูแลระบบ',
  teacher: 'ครู',
  eval: 'งานวัดและประเมินผล',
  deputy: 'รองผู้อำนวยการงานบริหารวิชาการ'
};
const STAGE_INFO = {
  pending_teacher: { step: 2, label: 'ขั้นตอนที่ 2 - รอครูที่ปรึกษา', color: 'amber' },
  pending_eval: { step: 3, label: 'ขั้นตอนที่ 3 - รองานวัดและประเมินผล', color: 'blue' },
  pending_deputy: { step: 4, label: 'ขั้นตอนที่ 4 - รอรองผู้อำนวยการ', color: 'purple' },
  complete: { step: 5, label: 'เสร็จสิ้น', color: 'green' },
  rejected: { step: 0, label: 'ไม่อนุมัติ', color: 'red' }
};

// ============================================================
// DB LAYER (In-Memory + Google Sheets Sync)
// ============================================================
const DB = {
  data: { users: [], semesters: [], classes: [], requests: [], theme: { primary: '#10b981', secondary: '#fbbf24' } },
  loaded: false,
  get(k, d) { const v = this.data[k]; return v === undefined ? d : v; },
  set(k, v) { this.data[k] = v; },
  async load() {
    const r = await apiCall('getAll');
    this.data.users = r.users || [];
    this.data.semesters = r.semesters || [];
    this.data.classes = r.classes || [];
    this.data.requests = r.requests || [];
    this.data.theme = r.theme || { primary: '#10b981', secondary: '#fbbf24' };
    this.loaded = true;
  }
};

// ============================================================
// HYBRID API CALL (แก้บั๊กตัวแปร user ไม่ให้ทับข้อมูลที่กำลังส่ง)
// ============================================================
async function apiCall(action, params = {}) {
  // 1. ถ้าทำงานใน Google Apps Script Web App โดยตรง
  if (typeof google !== 'undefined' && google.script && google.script.run) {
    return new Promise((resolve, reject) => {
      let runner = google.script.run
        .withSuccessHandler(res => resolve(res))
        .withFailureHandler(err => reject(err));

      if (action === 'getAll') runner.getInitialData();
      else if (action === 'uploadFile') runner.uploadFile(params.base64, params.filename, params.mimeType);
      else if (action === 'saveRequest') runner.saveStudentRequest(params.request);
      else if (action === 'updateRequest') runner.updateRequestRow(params.request);
      else if (action === 'approveRequest') runner.approveRequest(params.id, params.role, params.approvalData || params, state.user);
      else if (action === 'saveUser') runner.manageUser(params.isEdit ? 'edit' : 'add', params.user);
      else if (action === 'delUser') runner.manageUser('delete', { id: params.id });
      else if (action === 'resetDefaultUsers') runner.resetDefaultUsers();
      else if (action === 'saveSemester') runner.manageSemester('add', params.sem);
      else if (action === 'setCurrentSem') runner.manageSemester('setCurrent', { id: params.id });
      else if (action === 'delSem') runner.manageSemester('delete', { id: params.id });
      else if (action === 'saveClass') runner.manageClass(params.isEdit ? 'edit' : 'add', params.class);
      else if (action === 'delClass') runner.manageClass('delete', { id: params.id });
      else if (action === 'saveTheme') runner.saveThemeSettings(params.theme);
      else runner.getInitialData();
    });
  }

  // 2. ถ้าทำงานบน GitHub Pages หรือเบราว์เซอร์ภายนอก (วาง currentUser ไว้หน้า params เพื่อไม่ให้ทับ params.user)
  if (API_URL && !API_URL.includes('PASTE')) {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action, currentUser: state.user, ...params }),
      redirect: 'follow'
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const j = await res.json();
    if (!j.ok) throw new Error(j.error || 'API error');
    return j;
  }

  throw new Error('กรุณาตั้งค่า API_URL ใน index.html หรือเปิดใช้งานผ่าน Google Apps Script Web App');
}

async function uploadSignature(dataUrl, tag = 'sig') {
  if (!dataUrl || !dataUrl.startsWith('data:')) return dataUrl;
  try {
    const r = await apiCall('uploadFile', {
      base64: dataUrl, mimeType: 'image/png',
      filename: tag + '_' + Date.now() + '.png'
    });
    return r.url || dataUrl;
  } catch (e) {
    console.warn('อัปโหลดรูปลายเซ็นไม่สำเร็จ:', e);
    return dataUrl;
  }
}

// ============================================================
// STATE
// ============================================================
let state = {
  user: JSON.parse(localStorage.getItem('sv01_session') || 'null'),
  page: 'home',
  theme: { primary: '#10b981', secondary: '#fbbf24' },
  sidebarOpen: false,
  loading: true,
  filterSem: '', filterClass: '', filterSearch: '',
  filterPageSize: 10, filterPage: 1
};

// ============================================================
// UTILS
// ============================================================
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtDate = ts => {
  if (!ts) return '-';
  const d = new Date(ts);
  return d.toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: 'numeric' }) + ' ' + d.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });
};
const toast = (icon, title) => Swal.fire({ icon, title, toast: true, position: 'top-end', showConfirmButton: false, timer: 2000, timerProgressBar: true });

function shade(hex, pct) {
  const n = parseInt(hex.slice(1), 16); const a = [n >> 16, (n >> 8) & 0xff, n & 0xff];
  return '#' + a.map(v => Math.max(0, Math.min(255, v + Math.round(255 * pct / 100))).toString(16).padStart(2, '0')).join('');
}
function applyTheme() {
  const r = document.documentElement;
  r.style.setProperty('--primary', state.theme.primary);
  r.style.setProperty('--primary-dark', shade(state.theme.primary, -20));
  r.style.setProperty('--secondary', state.theme.secondary);
  r.style.setProperty('--bg', shade(state.theme.primary, 95));
}

// ============================================================
// AUTH
// ============================================================
function login(u, p) {
  const users = DB.get('users', []);
  const found = users.find(x => x.username === u && x.password === p);
  if (found) {
    state.user = { ...found };
    localStorage.setItem('sv01_session', JSON.stringify(state.user));
    return true;
  }
  return false;
}
function logout() {
  state.user = null;
  localStorage.removeItem('sv01_session');
  state.page = 'home';
}
function isLoggedIn() { return !!state.user; }
function hasRole(...roles) { return state.user && roles.includes(state.user.role); }

// ============================================================
// ROUTER
// ============================================================
const PROTECTED = ['admin-users', 'admin-semesters', 'admin-classes', 'teacher', 'eval', 'deputy', 'settings'];
function navigate(page) {
  if (PROTECTED.includes(page) && !isLoggedIn()) {
    return Swal.fire({
      icon: 'warning', title: 'กรุณาเข้าสู่ระบบ',
      text: 'คุณต้องเข้าสู่ระบบก่อนเข้าถึงหน้านี้',
      showCancelButton: true, confirmButtonText: 'เข้าสู่ระบบ', cancelButtonText: 'ยกเลิก',
      confirmButtonColor: state.theme.primary
    }).then(r => { if (r.isConfirmed) openLoginModal(); });
  }
  state.page = page;
  state.sidebarOpen = false;
  renderApp();
}

// ============================================================
// MENU ITEMS
// ============================================================
function menuItems() {
  const items = [{
    section: 'หลัก', items: [
      { id: 'home', label: 'หน้าแรก', icon: 'fa-house' },
      { id: 'student', label: 'ยื่นคำร้อง (สว.01)', icon: 'fa-file-pen' }
    ]
  }];
  if (isLoggedIn() && hasRole('admin')) {
    items.push({
      section: 'จัดการระบบ (Admin)', items: [
        { id: 'admin-users', label: 'ผู้ใช้งาน', icon: 'fa-users-gear' },
        { id: 'admin-semesters', label: 'ภาคเรียน/ปีการศึกษา', icon: 'fa-calendar-days' },
        { id: 'admin-classes', label: 'ชั้นเรียน & ที่ปรึกษา', icon: 'fa-school' },
        { id: 'settings', label: 'ตั้งค่าธีมสี', icon: 'fa-palette' }
      ]
    });
  }
  if (isLoggedIn() && hasRole('teacher')) {
    items.push({ section: 'งานอนุมัติ', items: [{ id: 'teacher', label: 'คิวรอครูอนุมัติ', icon: 'fa-chalkboard-user' }] });
  }
  if (isLoggedIn() && hasRole('eval')) {
    items.push({ section: 'งานอนุมัติ', items: [{ id: 'eval', label: 'คิวงานวัดและประเมินผล', icon: 'fa-clipboard-check' }] });
  }
  if (isLoggedIn() && hasRole('deputy')) {
    items.push({ section: 'งานอนุมัติ', items: [{ id: 'deputy', label: 'คิวรองผู้อำนวยการ', icon: 'fa-user-tie' }] });
  }
  if (isLoggedIn() && hasRole('admin')) {
    items.push({
      section: 'คิวงานอนุมัติทั้งหมด', items: [
        { id: 'teacher', label: 'คิวครู', icon: 'fa-chalkboard-user' },
        { id: 'eval', label: 'คิวงานวัดฯ', icon: 'fa-clipboard-check' },
        { id: 'deputy', label: 'คิวรองฯ', icon: 'fa-user-tie' }
      ]
    });
  }
  return items;
}

// ============================================================
// LAYOUT COMPONENTS
// ============================================================
function renderSidebar() {
  return `
  <aside class="sidebar-desktop fixed left-0 top-0 bottom-0 w-72 bg-white shadow-xl z-30 flex flex-col">
    <div class="p-5 border-b border-gray-100 flex items-center gap-3">
      <div class="w-11 h-11 rounded-xl flex items-center justify-center text-white shadow-lg" style="background:linear-gradient(135deg,var(--primary),var(--secondary))">
        <i class="fa-solid fa-file-signature text-lg"></i>
      </div>
      <div class="flex-1 min-w-0">
        <div class="font-bold text-gray-800 text-sm truncate">ระบบ สว.01</div>
        <div class="text-xs text-gray-500 truncate">คำร้องขอเข้าห้องสอบ</div>
      </div>
    </div>
    <div class="flex-1 overflow-y-auto p-3">
      ${renderMenuList()}
    </div>
    <div class="p-3 border-t border-gray-100">
      ${state.user ? `
        <div class="flex items-center gap-2 p-2 rounded-lg bg-gray-50 mb-2">
          <div class="w-9 h-9 rounded-full flex items-center justify-center text-white text-sm font-bold flex-shrink-0" style="background:var(--primary)">
            ${esc(state.user.fullName.charAt(0))}
          </div>
          <div class="flex-1 min-w-0">
            <div class="text-xs font-semibold text-gray-800 truncate">${esc(state.user.fullName)}</div>
            <div class="text-[10px] text-gray-500 truncate">${ROLE_LABELS[state.user.role] || state.user.role}</div>
          </div>
        </div>
        <button data-action="logout" class="w-full text-sm text-red-600 hover:bg-red-50 p-2 rounded-lg transition flex items-center gap-2 justify-center">
          <i class="fa-solid fa-right-from-bracket"></i> ออกจากระบบ
        </button>
      ` : `<button data-action="open-login" class="btn-primary w-full text-sm p-2.5 rounded-lg flex items-center gap-2 justify-center"><i class="fa-solid fa-right-to-bracket"></i> เข้าสู่ระบบ</button>`}
    </div>
  </aside>`;
}

function renderMenuList() {
  return menuItems().map(group => `
    <div class="mb-3">
      <div class="text-[10px] font-semibold text-gray-400 uppercase tracking-wider px-3 py-1">${group.section}</div>
      ${group.items.map(it => `
        <a data-action="nav" data-page="${it.id}" class="sidebar-item flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-gray-700 cursor-pointer mb-0.5 ${state.page === it.id ? 'active' : ''}">
          <i class="fa-solid ${it.icon} w-4 text-center"></i>
          <span class="truncate">${it.label}</span>
        </a>
      `).join('')}
    </div>
  `).join('');
}

function renderMobileDrawer() {
  if (!state.sidebarOpen) return '';
  return `
  <div class="fixed inset-0 z-50 lg:hidden">
    <div class="absolute inset-0 modal-backdrop" data-action="close-sidebar"></div>
    <aside class="absolute left-0 top-0 bottom-0 w-72 bg-white shadow-2xl flex flex-col fade-in">
      <div class="p-4 border-b border-gray-100 flex items-center justify-between">
        <div class="flex items-center gap-2">
          <div class="w-9 h-9 rounded-lg flex items-center justify-center text-white" style="background:linear-gradient(135deg,var(--primary),var(--secondary))">
            <i class="fa-solid fa-file-signature text-sm"></i>
          </div>
          <div class="font-bold text-gray-800 text-sm">ระบบ สว.01</div>
        </div>
        <button data-action="close-sidebar" class="w-8 h-8 rounded-full hover:bg-gray-100 flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="flex-1 overflow-y-auto p-3">${renderMenuList()}</div>
      <div class="p-3 border-t border-gray-100">
        ${state.user ? `
          <div class="flex items-center gap-2 p-2 rounded-lg bg-gray-50 mb-2">
            <div class="w-9 h-9 rounded-full flex items-center justify-center text-white text-sm font-bold" style="background:var(--primary)">${esc(state.user.fullName.charAt(0))}</div>
            <div class="flex-1 min-w-0">
              <div class="text-xs font-semibold text-gray-800 truncate">${esc(state.user.fullName)}</div>
              <div class="text-[10px] text-gray-500 truncate">${ROLE_LABELS[state.user.role] || state.user.role}</div>
            </div>
          </div>
          <button data-action="logout" class="w-full text-sm text-red-600 hover:bg-red-50 p-2 rounded-lg flex items-center gap-2 justify-center"><i class="fa-solid fa-right-from-bracket"></i> ออกจากระบบ</button>
        ` : `<button data-action="open-login" class="btn-primary w-full text-sm p-2.5 rounded-lg flex items-center gap-2 justify-center"><i class="fa-solid fa-right-to-bracket"></i> เข้าสู่ระบบ</button>`}
      </div>
    </aside>
  </div>`;
}

function renderTopBar() {
  return `
  <header class="sticky top-0 z-20 bg-white/80 backdrop-blur-md border-b border-gray-100 lg:px-6 px-4 py-3 flex items-center gap-3">
    <button class="lg:hidden w-9 h-9 rounded-lg hover:bg-gray-100 flex items-center justify-center" data-action="open-sidebar"><i class="fa-solid fa-bars text-gray-700"></i></button>
    <div class="flex-1 min-w-0">
      <div class="font-bold text-gray-800 truncate">${pageTitle(state.page)}</div>
      <div class="text-[11px] text-gray-500 truncate hidden sm:block">${pageSubtitle(state.page)}</div>
    </div>
    <div class="flex items-center gap-2">
      <button data-action="refresh" class="w-9 h-9 rounded-lg hover:bg-emerald-50 text-emerald-600 flex items-center justify-center" title="รีเฟรชข้อมูลจาก Google Sheet"><i class="fa-solid fa-arrows-rotate"></i></button>
      ${!state.user ? `<button data-action="open-login" class="hidden sm:flex btn-primary text-xs px-3 py-2 rounded-lg items-center gap-2"><i class="fa-solid fa-right-to-bracket"></i> เข้าสู่ระบบ</button>` :
      `<button data-action="logout" class="w-9 h-9 rounded-lg hover:bg-red-50 text-red-500 flex items-center justify-center" title="ออกจากระบบ"><i class="fa-solid fa-right-from-bracket"></i></button>`}
    </div>
  </header>`;
}

function pageTitle(p) {
  return { home: 'แดชบอร์ด', student: 'ยื่นคำร้องเข้าห้องสอบ (สว.01)', 'admin-users': 'จัดการผู้ใช้งาน', 'admin-semesters': 'จัดการภาคเรียน/ปีการศึกษา', 'admin-classes': 'จัดการชั้นเรียน', 'teacher': 'คิวรอครูที่ปรึกษาอนุมัติ', eval: 'คิวงานวัดและประเมินผล', deputy: 'คิวรองผู้อำนวยการ', 'settings': 'ตั้งค่าธีมสี' }[p] || 'หน้าแรก';
}
function pageSubtitle(p) {
  return { home: 'ภาพรวมระบบและเชื่อมโยง Google Sheet', student: 'นักเรียนกรอกคำร้องขอเข้าห้องสอบออนไลน์', teacher: 'ตรวจสอบและลงนามอนุมัติชั้นที่ดูแล', eval: 'ตรวจสอบและลงนามอนุมัติงานวัดผล', deputy: 'ตรวจสอบและลงนามอนุมัติขั้นสุดท้าย' }[p] || '';
}

function renderMobileBottomNav() {
  const isTeacher = hasRole('teacher'), isEval = hasRole('eval'), isDeputy = hasRole('deputy');
  const items = [
    { id: 'home', icon: 'fa-house', label: 'หน้าแรก' },
    { id: 'student', icon: 'fa-file-pen', label: 'ยื่นคำร้อง' }
  ];
  if (isTeacher) items.push({ id: 'teacher', icon: 'fa-chalkboard-user', label: 'คิวครู' });
  if (isEval) items.push({ id: 'eval', icon: 'fa-clipboard-check', label: 'คิววัดฯ' });
  if (isDeputy) items.push({ id: 'deputy', icon: 'fa-user-tie', label: 'คิวรองฯ' });
  if (!isTeacher && !isEval && !isDeputy) {
    items.push({ id: 'search', icon: 'fa-magnifying-glass', label: 'ค้นหา' });
  }
  return `
  <nav class="mobile-nav fixed bottom-0 left-0 right-0 z-30 bg-white/95 backdrop-blur border-t border-gray-200 px-2 py-1.5 justify-around">
    ${items.map(it => `
      <button data-action="nav" data-page="${it.id}" class="flex-1 flex flex-col items-center gap-0.5 py-1.5 rounded-lg ${state.page === it.id ? 'text-white' : 'text-gray-500'}" style="${state.page === it.id ? 'background:var(--primary)' : ''}">
        <i class="fa-solid ${it.icon} text-base"></i>
        <span class="text-[9px] font-medium">${it.label}</span>
      </button>

  }
  document.getElementById('app').innerHTML = `

      <main class="p-4 lg:p-6 fade-in">${renderPage()}</main>

function renderPage() {
  switch (state.page) {
    case 'home': return renderHome();
    case 'student': return renderStudent();
    case 'admin-users': return renderAdminUsers();
    case 'admin-semesters': return renderAdminSemesters();
    case 'admin-classes': return renderAdminClasses();
    case 'teacher': return renderApprovalQueue('teacher');
    case 'eval': return renderApprovalQueue('eval');
    case 'deputy': return renderApprovalQueue('deputy');
    case 'settings': return renderSettings();
    case 'search': return renderSearch();
    default: return renderHome();
  }
}

// -------------------- APPROVAL QUEUE --------------------
function renderApprovalQueue(role) {
  const roleMap = { teacher: 'pending_teacher', eval: 'pending_eval', deputy: 'pending_deputy' };
  let requests = DB.get('requests', []);
  const semesters = DB.get('semesters', []);
  const classes = DB.get('classes', []);

  // ครูเห็นเฉพาะห้องที่ตนเป็นที่ปรึกษา (ยกเว้นแอดมินดูได้หมด)
  if (role === 'teacher' && state.user && state.user.role !== 'admin') {
    const myClassIds = classes.filter(c => (c.advisors || []).includes(state.user.id)).map(c => c.id);
    requests = requests.filter(r => myClassIds.includes(r.classId));
  }

  requests = requests.filter(r => r.status === roleMap[role]);
  if (state.filterSem) {
    const [t, y] = state.filterSem.split('_');
    requests = requests.filter(r => r.term == t && r.academicYear == y);
  }
  if (state.filterClass) requests = requests.filter(r => r.classId === state.filterClass);
  if (state.filterSearch) requests = requests.filter(r => (r.firstName + r.lastName).includes(state.filterSearch));
  requests.sort((a, b) => b.createdAt - a.createdAt);

  const total = requests.length;
  const pageSize = state.filterPageSize;
  const totalPages = pageSize === 'all' ? 1 : Math.ceil(total / pageSize) || 1;
  const page = Math.min(state.filterPage, totalPages);
  const start = pageSize === 'all' ? 0 : (page - 1) * pageSize;
  const pageItems = pageSize === 'all' ? requests : requests.slice(start, start + pageSize);

  const rows = pageItems.map(r => `
    <tr class="hover:bg-gray-50">
      <td class="px-3 py-2 border-b border-gray-100 text-xs text-gray-500 whitespace-nowrap">${fmtDate(r.createdAt)}</td>
      <td class="px-3 py-2 border-b border-gray-100 text-sm font-medium">${esc(r.firstName)} ${esc(r.lastName)}</td>
      <td class="px-3 py-2 border-b border-gray-100 text-xs">${esc(r.className)}</td>
      <td class="px-3 py-2 border-b border-gray-100 text-xs">${esc(r.examType)}</td>
      <td class="px-3 py-2 border-b border-gray-100"><span class="text-[11px] px-2 py-0.5 rounded-full bg-${STAGE_INFO[r.status]?.color || 'gray'}-100 text-${STAGE_INFO[r.status]?.color || 'gray'}-700">${STAGE_INFO[r.status]?.label || r.status}</span></td>
      <td class="px-3 py-2 border-b border-gray-100 text-right">
        <button data-action="view-request" data-id="${r.id}" class="px-3 py-1.5 rounded-lg text-xs btn-primary"><i class="fa-solid fa-eye mr-1"></i> ดู/ลงนาม</button>
      </td>
    </tr>`).join('');

  const semOpts = semesters.map(s => `<option value="${s.term}_${s.year}">ภ.${s.term}/${s.year}</option>`).join('');
  const classOpts = classes.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('');

  return `
    <div class="space-y-4">
      <div class="card p-4">
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-2">
          <select data-filter="sem" class="border border-gray-300 rounded-lg px-3 py-2 text-sm focus-primary">
            <option value="">ทุกภาคเรียน</option>${semOpts}
          </select>
          <select data-filter="class" class="border border-gray-300 rounded-lg px-3 py-2 text-sm focus-primary">
            <option value="">ทุกชั้น</option>${classOpts}
          </select>
          <input data-filter="search" placeholder="ค้นหาชื่อนักเรียน..." value="${esc(state.filterSearch)}" class="border border-gray-300 rounded-lg px-3 py-2 text-sm focus-primary">
          <select data-filter="pageSize" class="border border-gray-300 rounded-lg px-3 py-2 text-sm focus-primary">
            ${[10, 25, 50, 100].map(n => `<option value="${n}" ${pageSize == n ? 'selected' : ''}>${n} รายการ</option>`).join('')}
            <option value="all" ${pageSize === 'all' ? 'selected' : ''}>ทั้งหมด</option>
          </select>
        </div>
      </div>
      <div class="card table-wrap">
        <table class="w-full text-sm min-w-[700px]">
          <thead><tr class="bg-gray-50 text-left text-xs font-semibold text-gray-600">
            <th class="px-3 py-2.5">วันที่ส่ง</th><th class="px-3 py-2.5">ชื่อ-นามสกุล</th>
            <th class="px-3 py-2.5">ชั้น</th><th class="px-3 py-2.5">ประเภท</th>
            <th class="px-3 py-2.5">สถานะ</th><th class="px-3 py-2.5 text-right">จัดการ</th>
          </tr></thead>
          <tbody>${rows || '<tr><td colspan="6" class="p-8 text-center text-gray-400">ไม่มีรายการรออนุมัติในขณะนี้</td></tr>'}</tbody>
        </table>
      </div>
      ${totalPages > 1 ? `<div class="flex items-center justify-between text-sm">
        <div class="text-gray-500">หน้า ${page}/${totalPages} (${total} รายการ)</div>
        <div class="flex gap-1">
          <button data-action="page-prev" class="px-3 py-1.5 rounded-lg border border-gray-300 hover:bg-gray-50" ${page <= 1 ? 'disabled style="opacity:.5"' : ''}><i class="fa-solid fa-chevron-left"></i></button>

let sigTarget = null;
function openSignatureModal(target) {
  sigTarget = target;
  Swal.fire({
    title: '<span style="font-size:1.1rem">ลายเซ็น</span>',
    html: `
      <div class="flex gap-2 mb-3 justify-center">
        <button type="button" id="sigTabDraw" class="px-3 py-1.5 rounded-lg text-xs font-medium bg-emerald-500 text-white">✍ วาดลายเซ็น</button>
        <button type="button" id="sigTabUpload" class="px-3 py-1.5 rounded-lg text-xs font-medium bg-gray-100 text-gray-700">⬆ อัปโหลดรูปภาพ</button>
      </div>
      <div id="sigDrawPane">
        <canvas id="sigCanvas" width="460" height="200"></canvas>
        <div class="flex gap-2 justify-center mt-2"><button type="button" id="sigClear" class="px-3 py-1.5 rounded-lg bg-gray-100 text-xs hover:bg-gray-200">ล้างกระดาน</button></div>
      </div>
      <div id="sigUploadPane" style="display:none">
        <input type="file" id="sigFile" accept="image/png,image/jpeg" class="text-sm">
        <p class="text-xs text-gray-500 mt-2">ระบบจะลบพื้นหลังขาวโดยอัตโนมัติให้โปร่งใส</p>
        <div id="sigUploadPreview" class="mt-3 flex justify-center"></div>
      </div>
    `,
    showCancelButton: true, confirmButtonText: 'บันทึก', cancelButtonText: 'ยกเลิก',
    confirmButtonColor: state.theme.primary,
    didOpen: () => {
      const canvas = document.getElementById('sigCanvas');
      const ctx = canvas.getContext('2d');
      ctx.lineWidth = 2.5; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#1f2937';
      let drawing = false, lastX = 0, lastY = 0;
      const pos = e => {
        const r = canvas.getBoundingClientRect();
        const t = e.touches ? e.touches[0] : e;
        return { x: (t.clientX - r.left) * (canvas.width / r.width), y: (t.clientY - r.top) * (canvas.height / r.height) };
      };
      const start = e => { e.preventDefault(); drawing = true; const p = pos(e); lastX = p.x; lastY = p.y; };
      const move = e => { if (!drawing) return; e.preventDefault(); const p = pos(e); ctx.beginPath(); ctx.moveTo(lastX, lastY); ctx.lineTo(p.x, p.y); ctx.stroke(); lastX = p.x; lastY = p.y; };
      const end = () => { drawing = false; };
      canvas.addEventListener('mousedown', start); canvas.addEventListener('mousemove', move);
      canvas.addEventListener('mouseup', end); canvas.addEventListener('mouseleave', end);
      canvas.addEventListener('touchstart', start); canvas.addEventListener('touchmove', move); canvas.addEventListener('touchend', end);

      document.getElementById('sigClear').onclick = () => ctx.clearRect(0, 0, canvas.width, canvas.height);
      document.getElementById('sigTabDraw').onclick = () => {
        document.getElementById('sigDrawPane').style.display = 'block';
        document.getElementById('sigUploadPane').style.display = 'none';
        document.getElementById('sigTabDraw').className = 'px-3 py-1.5 rounded-lg text-xs font-medium bg-emerald-500 text-white';
        document.getElementById('sigTabUpload').className = 'px-3 py-1.5 rounded-lg text-xs font-medium bg-gray-100 text-gray-700';
      };
      document.getElementById('sigTabUpload').onclick = () => {
        document.getElementById('sigDrawPane').style.display = 'none';
        document.getElementById('sigUploadPane').style.display = 'block';
        document.getElementById('sigTabUpload').className = 'px-3 py-1.5 rounded-lg text-xs font-medium bg-emerald-500 text-white';
        document.getElementById('sigTabDraw').className = 'px-3 py-1.5 rounded-lg text-xs font-medium bg-gray-100 text-gray-700';
      };
      document.getElementById('sigFile').onchange = async (e) => {
        const file = e.target.files[0]; if (!file) return;
        const reader = new FileReader();
        reader.onload = ev => {
          const img = new Image();
          img.onload = () => {
            const processed = removeWhiteBackground(img);
            document.getElementById('sigUploadPreview').innerHTML = `<img src="${processed}" style="max-height:120px;max-width:100%">`;
            document.getElementById('sigUploadPreview').dataset.url = processed;
          };
          img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
      };
    },
    preConfirm: () => {
      const drawPane = document.getElementById('sigDrawPane');
      if (drawPane.style.display !== 'none') {
        const canvas = document.getElementById('sigCanvas');
        const data = canvas.toDataURL('image/png');
        if (data.length < 1000) return Swal.showValidationMessage('กรุณาวาดลายเซ็นก่อน');
        return data;
      } else {
        const prev = document.getElementById('sigUploadPreview');
        if (!prev.dataset.url) return Swal.showValidationMessage('กรุณาอัปโหลดรูปภาพ');
        return prev.dataset.url;
      }
    }
  }).then(r => {
    if (r.isConfirmed && r.value) {
      window._lastSig = r.value;
      if (sigTarget === 'student') {
        document.getElementById('studentSignature').value = r.value;
        document.getElementById('studentSigPreview').innerHTML = `<img src="${r.value}" style="max-height:70px;max-width:100%">`;
      } else if (sigTarget === 'approver') {
        window._sigTemp = r.value;
        const preview = document.getElementById('signPreview');
        if (preview) preview.innerHTML = `<img src="${r.value}" style="max-height:60px;max-width:100%">`;
      }
    }
  });
}

function removeWhiteBackground(img) {
  const c = document.createElement('canvas');
  c.width = img.width; c.height = img.height;
  const ctx = c.getContext('2d');
  ctx.drawImage(img, 0, 0);
  const data = ctx.getImageData(0, 0, c.width, c.height);
  let minX = c.width, minY = c.height, maxX = 0, maxY = 0;
  for (let i = 0; i < data.data.length; i += 4) {
    const r = data.data[i], g = data.data[i + 1], b = data.data[i + 2];
    if (r > 235 && g > 235 && b > 235) {
      data.data[i + 3] = 0;
    } else {
      const px = (i / 4) % c.width, py = Math.floor((i / 4) / c.width);
      if (px < minX) minX = px; if (px > maxX) maxX = px;
      if (py < minY) minY = py; if (py > maxY) maxY = py;
    }
  }
  ctx.putImageData(data, 0, 0);
  if (maxX <= minX || maxY <= minY) return c.toDataURL('image/png');
  const w = maxX - minX + 10, h = maxY - minY + 10;
  const out = document.createElement('canvas');
  out.width = w; out.height = h;
  out.getContext('2d').drawImage(c, minX - 5, minY - 5, w, h, 0, 0, w, h);
  return out.toDataURL('image/png');
}

      return { approve, note, sig: window._sigTemp };
    }
  }).then(r => {
    if (r.isConfirmed && r.value) applyApproval(reqId, role, r.value);
  });
}

async function applyApproval(reqId, role, { approve, note, sig }) {
  Swal.fire({ title: 'กำลังบันทึกการอนุมัติและประมวลผล...', didOpen: () => Swal.showLoading(), allowOutsideClick: false });
  try {
    const requests = DB.get('requests', []);
    const req = requests.find(r => r.id === reqId);
    if (!req) throw new Error('ไม่พบคำร้อง');

    const sigUrl = await uploadSignature(sig, role + '_' + reqId);
    const me = state.user;

    if (role === 'teacher') {
      req.teacherApproval = approve; req.teacherNote = note; req.teacherName = me.fullName;
      req.signatures.teacher = sigUrl;
      req.status = approve === 'approve' ? 'pending_eval' : 'rejected';
    } else if (role === 'eval') {
      req.evalApproval = approve; req.evalNote = note; req.evalName = me.fullName;
      req.signatures.eval = sigUrl;
      req.status = approve === 'approve' ? 'pending_deputy' : 'rejected';
    } else if (role === 'deputy') {
      req.deputyApproval = approve; req.deputyNote = note; req.deputyName = me.fullName;
      req.signatures.deputy = sigUrl;
      req.status = approve === 'approve' ? 'complete' : 'rejected';
    }

    const res = await apiCall('updateRequest', { request: req });
    if (res.pdfUrl) req.pdfUrl = res.pdfUrl;
    if (res.slideUrl) req.slideUrl = res.slideUrl;

    await DB.load();
    Swal.fire({
      icon: 'success',
      title: 'บันทึกการอนุมัติเรียบร้อย',
      html: req.pdfUrl ? `<p>สร้างเอกสาร PDF เสร็จแล้ว</p><a href="${req.pdfUrl}" target="_blank" class="mt-2 inline-block px-4 py-2 bg-emerald-600 text-white rounded-lg text-sm font-medium">เปิดไฟล์ PDF</a>` : '',
      confirmButtonColor: state.theme.primary
    });
    renderApp();
  } catch (err) {
    Swal.fire('เกิดข้อผิดพลาด', err.message, 'error');
  }
}

async function downloadPDF(reqId) {
  const req = DB.get('requests', []).find(r => r.id === reqId);
  if (!req) return;
  Swal.fire({ title: 'กำลังสร้าง PDF...', didOpen: () => Swal.showLoading(), allowOutsideClick: false });
  try {
    const wrap = document.createElement('div');
    wrap.style.cssText = 'position:fixed;left:-9999px;top:0;width:794px;padding:40px;background:white;font-family:Sarabun,sans-serif;color:#000';
    wrap.innerHTML = buildFormHTML(req);
    document.body.appendChild(wrap);
    const canvas = await html2canvas(wrap, { scale: 2, useCORS: true, backgroundColor: '#fff' });
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF('p', 'mm', 'a4');
    const w = 210, h = (canvas.height * w) / canvas.width;
    const img = canvas.toDataURL('image/png');
    if (h > 297) {
      let posY = 0;
      const pageH = canvas.width * 297 / 210;
      while (posY < canvas.height) {
        const sh = Math.min(pageH, canvas.height - posY);
        const tmp = document.createElement('canvas');
        tmp.width = canvas.width; tmp.height = sh;
        tmp.getContext('2d').drawImage(canvas, 0, posY, canvas.width, sh, 0, 0, canvas.width, sh);
        if (posY > 0) pdf.addPage();
        pdf.addImage(tmp.toDataURL('image/png'), 'PNG', 0, 0, w, (sh * w) / canvas.width);
        posY += sh;
      }
    } else {
      pdf.addImage(img, 'PNG', 0, 0, w, h);
    }
    pdf.save(`สว01_${req.firstName}_${req.lastName}.pdf`);
    document.body.removeChild(wrap);
    Swal.close();
    toast('success', 'ดาวน์โหลดเอกสาร PDF สำเร็จ');
  } catch (e) {
    Swal.fire('ข้อผิดพลาด', e.message, 'error');
  }
}
window.downloadPDF = downloadPDF;

document.addEventListener('click', async e => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const action = el.dataset.action;
  const id = el.dataset.id;

  if (action === 'nav') { e.preventDefault(); navigate(el.dataset.page); return; }
  if (action === 'open-sidebar') { state.sidebarOpen = true; renderApp(); return; }
  if (action === 'close-sidebar') { state.sidebarOpen = false; renderApp(); return; }
  if (action === 'open-login') { openLoginModal(); return; }
  if (action === 'refresh') {
    state.loading = true; renderApp();
    try { await DB.load(); toast('success', 'อัปเดตข้อมูลจาก Google Sheet แล้ว'); } catch (e) { toast('error', e.message); }
    state.loading = false; renderApp(); return;
  }
  if (action === 'logout') {
    Swal.fire({ title: 'ออกจากระบบ?', icon: 'question', showCancelButton: true, confirmButtonText: 'ออกจากระบบ', cancelButtonText: 'ยกเลิก', confirmButtonColor: '#ef4444' })
      .then(r => { if (r.isConfirmed) { logout(); renderApp(); toast('success', 'ออกจากระบบแล้ว'); } });
    return;
  }
  if (action === 'open-signature') { openSignatureModal(el.dataset.target); return; }
  if (action === 'add-subject') { addSubjectRow(); return; }
  if (action === 'remove-subject') { el.closest('tr').remove(); return; }
  if (action === 'reset-form') {
    document.getElementById('studentForm')?.reset();
    initSubjects();
    document.getElementById('studentSigPreview').innerHTML = 'ยังไม่มีลายเซ็น';
    document.getElementById('studentSignature').value = '';
    document.getElementById('sigNamePreview').textContent = '-';
    return;
  }

  // Admin Users
  if (action === 'add-user') { openUserForm(); return; }
  if (action === 'edit-user') { openUserForm(id); return; }
  if (action === 'del-user') {
    Swal.fire({ title: 'ลบผู้ใช้?', icon: 'warning', showCancelButton: true, confirmButtonText: 'ลบ', cancelButtonText: 'ยกเลิก', confirmButtonColor: '#ef4444' })
      .then(async r => {
        if (r.isConfirmed) {
          try {
            await apiCall('delUser', { id });
            await DB.load();
            toast('success', 'ลบผู้ใช้แล้ว'); renderApp();
          } catch (e) { Swal.fire('ผิดพลาด', e.message, 'error'); }
        }
      });
    return;
  }

  // Reset default users
  if (action === 'reset-default-users') {
    Swal.fire({
      title: 'รีเซ็ตบัญชีผู้ใช้เริ่มต้น?',
      html: `ระบบจะสร้างและกู้คืนบัญชีผู้ใช้เริ่มต้นครบทั้ง 5 บทบาท:<br>
      • <b>admin</b> (ผู้ดูแลระบบ)<br>
      • <b>teacher</b> (ครูสมศรี ที่ปรึกษา ม.1/1)<br>
      • <b>teacher2</b> (ครูสมชาย ที่ปรึกษา ม.1/2)<br>
      • <b>eval</b> (หัวหน้างานวัดและประเมินผล)<br>
      • <b>deputy</b> (รองผู้อำนวยการฝ่ายวิชาการ)`,
      icon: 'question',
      showCancelButton: true,
      confirmButtonText: 'ยืนยันรีเซ็ต',
      cancelButtonText: 'ยกเลิก',
      confirmButtonColor: state.theme.primary
    }).then(async r => {
      if (r.isConfirmed) {
        Swal.fire({ title: 'กำลังรีเซ็ตบัญชีเริ่มต้น...', didOpen: () => Swal.showLoading(), allowOutsideClick: false });
        try {
          await apiCall('resetDefaultUsers');
          await DB.load();
          Swal.close();
          toast('success', 'รีเซ็ตบัญชีผู้ใช้เริ่มต้นเรียบร้อย');
          renderApp();
        } catch (e) {
          Swal.fire('ผิดพลาด', e.message, 'error');
        }
      }
    });
    return;
  }

  // Admin Semesters
  if (action === 'add-sem') { openSemForm(); return; }
  if (action === 'set-current-sem') {
    try {
      await apiCall('setCurrentSem', { id });
      await DB.load();
      toast('success', 'ตั้งเป็นภาคเรียนปัจจุบันแล้ว'); renderApp();
    } catch (e) { Swal.fire('ผิดพลาด', e.message, 'error'); }
    return;
  }
  if (action === 'del-sem') {
    Swal.fire({ title: 'ลบภาคเรียน?', icon: 'warning', showCancelButton: true, confirmButtonText: 'ลบ', cancelButtonText: 'ยกเลิก', confirmButtonColor: '#ef4444' })
      .then(async r => {
        if (r.isConfirmed) {
          try {
            await apiCall('delSem', { id });
            await DB.load();
            toast('success', 'ลบภาคเรียนแล้ว'); renderApp();
          } catch (e) { Swal.fire('ผิดพลาด', e.message, 'error'); }
        }
      });
    return;
  }

  // Admin Classes
  if (action === 'add-class') { openClassForm(); return; }
  if (action === 'edit-class') { openClassForm(id); return; }
  if (action === 'del-class') {
    Swal.fire({ title: 'ลบชั้นเรียน?', icon: 'warning', showCancelButton: true, confirmButtonText: 'ลบ', cancelButtonText: 'ยกเลิก', confirmButtonColor: '#ef4444' })
      .then(async r => {
        if (r.isConfirmed) {
          try {
            await apiCall('delClass', { id });
            await DB.load();
            toast('success', 'ลบชั้นเรียนแล้ว'); renderApp();
          } catch (e) { Swal.fire('ผิดพลาด', e.message, 'error'); }
        }
      });
    return;
  }

  // View request
  if (action === 'view-request') { openRequestDetail(id); return; }

  // Theme settings
  if (action === 'save-theme') {
    state.theme = { primary: document.getElementById('colorPrimary').value, secondary: document.getElementById('colorSecondary').value };
    try {
      await apiCall('saveTheme', { theme: state.theme });
      applyTheme(); toast('success', 'บันทึกธีมแล้ว'); renderApp();
    } catch (e) { Swal.fire('ผิดพลาด', e.message, 'error'); }
    return;
  }
  if (action === 'reset-theme') {
    state.theme = { primary: '#10b981', secondary: '#fbbf24' };
    try {
      await apiCall('saveTheme', { theme: state.theme });
      applyTheme(); toast('success', 'รีเซ็ตธีมแล้ว'); renderApp();
    } catch (e) { Swal.fire('ผิดพลาด', e.message, 'error'); }
    return;
  }

  // Pagination
  if (action === 'page-prev') { state.filterPage = Math.max(1, (state.filterPage || 1) - 1); renderApp(); return; }
  if (action === 'page-next') { state.filterPage = (state.filterPage || 1) + 1; renderApp(); return; }
});

          <label class="text-xs font-semibold text-gray-700 block mb-1">ตำแหน่ง (ถ้ามี)</label>
          <input id="uf_pos" placeholder="เช่น ครูที่ปรึกษา ม.1/1, เจ้าหน้าที่วัดผล" value="${esc(u.position || '')}" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus-primary">
        </div>
      </div>
    `,
    width: '450px',
    showCancelButton: true, confirmButtonText: 'บันทึก', cancelButtonText: 'ยกเลิก',
    confirmButtonColor: state.theme.primary,
    preConfirm: () => {
      const data = {
        username: document.getElementById('uf_user').value.trim(),
        password: document.getElementById('uf_pass').value.trim(),
        fullName: document.getElementById('uf_name').value.trim(),
        role: document.getElementById('uf_role').value,
        position: document.getElementById('uf_pos').value.trim()
      };
      if (!data.username || !data.password || !data.fullName) return Swal.showValidationMessage('กรุณากรอกข้อมูลให้ครบทุกช่อง');
      if (users.some(x => x.username.toLowerCase() === data.username.toLowerCase() && x.id !== id)) {
        return Swal.showValidationMessage('Username นี้มีอยู่ในระบบแล้ว กรุณาใช้ชื่ออื่น');
      }
      return data;
    }
  }).then(async r => {
    if (r.isConfirmed && r.value) {
      Swal.fire({ title: 'กำลังบันทึกข้อมูลผู้ใช้...', didOpen: () => Swal.showLoading(), allowOutsideClick: false });
      try {
        await apiCall('saveUser', { user: { id: id || uid(), ...r.value }, isEdit: !!id });
        await DB.load();
        Swal.close();
        toast('success', id ? 'แก้ไขข้อมูลผู้ใช้แล้ว' : 'เพิ่มผู้ใช้ใหม่สำเร็จ');
        renderApp();
      } catch (e) {
        Swal.fire('ผิดพลาด', e.message, 'error');
      }
    }
  });
}

// ============================================================
// SEMESTER FORM MODAL
// ============================================================
function openSemForm() {
  const sems = DB.get('semesters', []);
  Swal.fire({
    title: 'เพิ่มภาคเรียน/ปีการศึกษา',
    html: `
      <select id="sf_term" class="swal2-input">
        <option value="1">ภาคเรียนที่ 1</option>
        <option value="2">ภาคเรียนที่ 2</option>
      </select>
      <input id="sf_year" type="number" placeholder="ปีการศึกษา (เช่น 2568)" value="2568" class="swal2-input">
    `,
    showCancelButton: true, confirmButtonText: 'บันทึก', cancelButtonText: 'ยกเลิก',
    confirmButtonColor: state.theme.primary,
    preConfirm: () => {
      const term = +document.getElementById('sf_term').value;
      const year = +document.getElementById('sf_year').value;
      if (!year) return Swal.showValidationMessage('กรุณากรอกปีการศึกษา');
      if (sems.some(s => s.term == term && s.year == year)) return Swal.showValidationMessage('ภาคเรียนและปีการศึกษานี้มีอยู่แล้ว');
      return { term, year };
    }
  }).then(async r => {
    if (r.isConfirmed && r.value) {
      try {
        await apiCall('saveSemester', { sem: { id: uid(), ...r.value, current: false } });
        await DB.load();
        toast('success', 'เพิ่มภาคเรียนแล้ว'); renderApp();
      } catch (e) { Swal.fire('ผิดพลาด', e.message, 'error'); }
    }
  });
}

// ============================================================
// CLASS FORM MODAL
// ============================================================
function openClassForm(id) {
  const classes = DB.get('classes', []);
  const users = DB.get('users', []).filter(u => u.role === 'teacher');
  const c = id ? classes.find(x => x.id === id) : { name: '', advisors: [] };
  Swal.fire({
    title: id ? 'แก้ไขชั้นเรียน' : 'เพิ่มชั้นเรียน',
    html: `
      <div class="text-left space-y-2">
        <input id="cf_name" placeholder="ชื่อชั้น (เช่น ม.1/1)" value="${esc(c.name)}" class="swal2-input">
        <div class="text-xs text-gray-600 mb-1">เลือกครูที่ปรึกษา (สามารถเลือกได้หลายท่าน)</div>
        <div class="max-h-48 overflow-y-auto border rounded p-2 bg-gray-50 space-y-1">
          ${teachers.length ? teachers.map(t => `
            <label class="flex items-center gap-2 p-1 hover:bg-white rounded cursor-pointer text-sm">
              <input type="checkbox" value="${t.id}" ${(c.advisors || []).includes(t.id) ? 'checked' : ''} class="cf_adv">
              <span>${esc(t.fullName)} ${t.position ? `<small class="text-gray-500">(${esc(t.position)})</small>` : ''}</span>
            </label>
          `).join('') : '<div class="text-xs text-gray-400 p-2">ยังไม่มีครูในระบบ</div>'}
        </div>
      </div>
    `,
    width: '500px',
    showCancelButton: true, confirmButtonText: 'บันทึก', cancelButtonText: 'ยกเลิก',
    confirmButtonColor: state.theme.primary,
    preConfirm: () => {
      const name = document.getElementById('cf_name').value.trim();
      if (!name) return Swal.showValidationMessage('กรุณากรอกชื่อชั้นเรียน');
      const advisors = [...document.querySelectorAll('.cf_adv:checked')].map(x => x.value);
      const advisorNames = advisors.map(aid => teachers.find(t => t.id === aid)?.fullName).filter(Boolean).join(', ');
      return { name, advisors, advisorNames };
    }
  }).then(async r => {
    if (r.isConfirmed && r.value) {
      try {
        await apiCall('saveClass', { class: { id: id || uid(), ...r.value }, isEdit: !!id });
        await DB.load();
        toast('success', id ? 'แก้ไขแล้ว' : 'เพิ่มแล้ว'); renderApp();
      } catch (e) { Swal.fire('ผิดพลาด', e.message, 'error'); }
    }
  });
}

// ============================================================
// SUBJECT ROWS
// ============================================================
let subjectCount = 0;
function initSubjects() {
  subjectCount = 0;
  const tbody = document.getElementById('subjectRows');
  if (!tbody) return;
  tbody.innerHTML = '';
  for (let i = 0; i < 3; i++) addSubjectRow();
}
function addSubjectRow() {
  const tbody = document.getElementById('subjectRows');
  if (!tbody) return;
  if (subjectCount >= 7) { toast('warning', 'สามารถเพิ่มได้สูงสุด 7 รายวิชา'); return; }
  const idx = subjectCount++;
  tbody.insertAdjacentHTML('beforeend', renderSubjectRow(idx));
}

// ============================================================
// FILTER EVENTS
// ============================================================
document.addEventListener('change', e => {
  const f = e.target.dataset.filter;
  if (!f) return;
  if (f === 'sem') state.filterSem = e.target.value;
  else if (f === 'class') state.filterClass = e.target.value;
  else if (f === 'pageSize') { state.filterPageSize = e.target.value === 'all' ? 'all' : +e.target.value; state.filterPage = 1; }
  renderApp();
});
document.addEventListener('input', e => {
  if (e.target.dataset.filter === 'search') {
    state.filterSearch = e.target.value;
    state.filterPage = 1;
    clearTimeout(window._searchTimer);
    window._searchTimer = setTimeout(() => renderApp(), 300);
  }
  if (e.target.name === 'firstName' || e.target.name === 'lastName') {
    const f = document.querySelector('[name=firstName]')?.value || '';
    const l = document.querySelector('[name=lastName]')?.value || '';
    const p = document.getElementById('sigNamePreview');
    if (p) p.textContent = (f + ' ' + l).trim() || '-';
  }
});

// ============================================================
// STUDENT FORM SUBMISSION
// ============================================================
document.addEventListener('submit', async e => {
  if (e.target.id !== 'studentForm') return;
  e.preventDefault();
  const fd = new FormData(e.target);
  const sig = document.getElementById('studentSignature').value;
  if (!sig) { Swal.fire('แจ้งเตือน', 'กรุณาลงลายเซ็นนักเรียนก่อนส่งคำร้อง', 'warning'); return; }

  const classes = DB.get('classes', []);
  const classId = fd.get('classId');
  const cls = classes.find(c => c.id === classId);
  if (!cls || !cls.advisors || cls.advisors.length === 0) {
    Swal.fire('แจ้งเตือน', 'ชั้นเรียนนี้ยังไม่มีครูที่ปรึกษาในระบบ กรุณาติดต่อผู้ดูแลระบบ', 'warning'); return;
  }

  const subjects = [];
  for (let i = 0; i < subjectCount; i++) {
    if (!fd.get('code_' + i)) continue;
    subjects.push({
      order: fd.get('order_' + i),
      code: fd.get('code_' + i),
      name: fd.get('name_' + i),
      time: fd.get('time_' + i)
    });
  }
  if (subjects.length === 0) { Swal.fire('แจ้งเตือน', 'กรุณากรอกรายวิชาอย่างน้อย 1 รายการ', 'warning'); return; }

  Swal.fire({
    title: 'กำลังบันทึกข้อมูล...',
    html: 'กำลังบันทึกลง Google Sheet และอัปโหลดไฟล์ลายเซ็น',
    didOpen: () => Swal.showLoading(),
    allowOutsideClick: false
  });

  try {
    const req = {
      id: uid(),
      day: fd.get('day'), month: fd.get('month'), year: fd.get('year'),
      firstName: fd.get('firstName'), lastName: fd.get('lastName'),
      classId, className: cls.name,
      room: fd.get('room'), building: fd.get('building'), phone: fd.get('phone'),
      examType: fd.get('examType'), term: fd.get('term'), academicYear: fd.get('academicYear'),
      reason: fd.get('reason'), examDate: fd.get('examDate'),
      subjects,
      signatures: { student: sig, teacher: '', eval: '', deputy: '' },
      status: 'pending_teacher',
      teacherApproval: '', evalApproval: '', deputyApproval: '',
      teacherNote: '', evalNote: '', deputyNote: '',
      teacherName: '', evalName: '', deputyName: '',
      createdAt: Date.now()
    };

    await apiCall('saveRequest', { request: req });
    await DB.load();

    Swal.fire({
      icon: 'success',
      title: 'ส่งคำร้องสำเร็จ',
      html: `คำร้องถูกส่งไปยังครูที่ปรึกษาเรียบร้อยแล้ว<br><small class="text-gray-500">สถานะ: ${STAGE_INFO.pending_teacher.label}</small>`,
      confirmButtonColor: state.theme.primary
    }).then(() => {
      e.target.reset();
      initSubjects();
      document.getElementById('studentSigPreview').innerHTML = 'ยังไม่มีลายเซ็น';
      document.getElementById('sigNamePreview').textContent = '-';
      state.page = 'home';
      renderApp();
    });
  } catch (err) {
    Swal.fire('เกิดข้อผิดพลาดในการบันทึก', err.message, 'error');
  }
});

// ============================================================
// BIND PAGE EVENTS
// ============================================================
function bindPageEvents() {
  if (state.page === 'student') initSubjects();
}

// ============================================================
// BOOTSTRAP
// ============================================================
(async function boot() {
  applyTheme();
  state.loading = true;
  renderApp();
  try {
    await DB.load();
    state.theme = DB.get('theme', state.theme);
    applyTheme();
  } catch (e) {
    console.error('Boot loading error:', e);
    toast('error', 'เชื่อมต่อข้อมูลไม่สำเร็จ: ' + e.message);
  }
  state.loading = false;
  renderApp();
})();

</script>
</body>
</html>
