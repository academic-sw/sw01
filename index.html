function openAdminEditRequest(reqId) {

  const classes = DB.get('classes', []);
  const curBE = getCurrentBE();

          </div>
          <div>
            <label class="font-semibold text-gray-700 block mb-1">เดือน</label>

              ${THAI_MONTHS_FULL.map(m => `<option value="${m}" ${req.month === m ? 'selected' : ''}>${m}</option>`).join('')}

    cancelButtonText: 'ยกเลิก',
    confirmButtonColor: state.theme.primary,
    preConfirm: () => {
      const firstName = document.getElementById('ed_firstName')?.value.trim();
      const lastName = document.getElementById('ed_lastName')?.value.trim();
      if (!firstName || !lastName) {
        Swal.showValidationMessage('กรุณากรอกชื่อและนามสกุลนักเรียน');
        return false;
      }
      const classSelect = document.getElementById('ed_classId');
      const selectedClassId = classSelect?.value || req.classId;
      const selectedClassName = classSelect?.options[classSelect.selectedIndex]?.text || req.className;

      return {
        id: req.id,
        day: document.getElementById('ed_day')?.value || req.day,
        month: document.getElementById('ed_month')?.value || req.month,
        year: document.getElementById('ed_year')?.value || req.year || curBE,
        firstName,
        lastName,
        fullName: firstName + ' ' + lastName,
        classId: selectedClassId,
        className: selectedClassName,
        phone: document.getElementById('ed_phone')?.value || '',
        room: document.getElementById('ed_room')?.value || '',
        building: document.getElementById('ed_building')?.value || '',
        examType: document.getElementById('ed_examType')?.value || req.examType,
        term: document.getElementById('ed_term')?.value || req.term,
        academicYear: document.getElementById('ed_academicYear')?.value || req.academicYear || curBE,
        examDate: document.getElementById('ed_examDate')?.value || req.examDate,
        reason: document.getElementById('ed_reason')?.value || '',
        status: document.getElementById('ed_status')?.value || req.status

    }
  }).then(async r => {
    if (r.isConfirmed && r.value) {
      Swal.fire({
        title: 'กำลังบันทึกข้อมูล...',
        html: 'กำลังอัปเดตลง Google Sheets และปรับปรุงเอกสาร PDF',

        await DB.load();

        });

    }
  });

async function adminDeleteRequest(reqId) {
  const req = DB.get('requests', []).find(r => r.id === reqId);
  const studentName = req ? `${req.firstName} ${req.lastName}` : reqId;

  const confirmRes = await Swal.fire({
    title: 'ยืนยันลบคำร้อง?',
    html: `คุณแน่ใจหรือไม่ว่าต้องการลบคำร้องของ <b>${esc(studentName)}</b>?<br><span class="text-xs text-red-500 font-medium">ข้อมูลจะถูกลบออกจาก Google Sheets ทั้งชีทหลักและชีทประจำชั้นอย่างถาวร</span>`,
    icon: 'warning',
    showCancelButton: true,
    confirmButtonColor: '#ef4444',
    cancelButtonColor: '#6b7280',
    confirmButtonText: '<i class="fa-solid fa-trash mr-1"></i> ลบคำร้อง',
    cancelButtonText: 'ยกเลิก'
  });

  if (!confirmRes.isConfirmed) return;

  Swal.fire({
    title: 'กำลังลบคำร้อง...',
    html: 'กำลังลบข้อมูลออกจาก Google Sheets',
    didOpen: () => Swal.showLoading(),
    allowOutsideClick: false
  });

  try {
    const res = await apiCall('delRequest', { id: reqId, reqId: reqId });
    if (res && res.error) throw new Error(res.error);
    await DB.load();
    toast('success', 'ลบคำร้องเรียบร้อยแล้ว');
    renderApp();
  } catch (err) {
    Swal.fire({
      icon: 'error',
      title: 'ลบคำร้องไม่สำเร็จ',
      text: err.message || 'เกิดข้อผิดพลาดในการเชื่อมต่อ Google Sheets'
    });
  }
}

let API_URL = 'https://script.google.com/macros/s/AKfycbzAduHZzHrSZgPsjSGbSmCmG1FbLDV34cVQCDCz83P_886yBD0xWoVNPRpVP9C5qBCQ/exec';

const ROLE_LABELS = {
  admin: 'ผู้ดูแลระบบ',
  teacher: 'ครู',
  eval: 'งานวัดและประเมินผล',

  rejected: { step: 0, label: 'ไม่อนุมัติ', color: 'red' }
};

// ============================================================
// DB LAYER (In-Memory + Google Sheets Sync)
// ============================================================
const DB = {
  data: { users: [], semesters: [], classes: [], requests: [], theme: { primary: '#10b981', secondary: '#fbbf24' } },
  loaded: false,
  get(k, d) { const v = this.data[k]; return v === undefined ? d : v; },
  set(k, v) { this.data[k] = v; },
  async load() {
    const r = await apiCall('getAll');
    this.data.users = r.users || [];
    this.data.semesters = r.semesters || [];
    this.data.classes = r.classes || [];
    this.data.requests = r.requests || [];
    this.data.theme = r.theme || { primary: '#10b981', secondary: '#fbbf24' };
    this.loaded = true;
  }
};

// ============================================================
// HYBRID API CALL (แก้บั๊กตัวแปร user ไม่ให้ทับข้อมูลที่กำลังส่ง)
// ============================================================
async function apiCall(action, params = {}) {
  // 1. ถ้าทำงานใน Google Apps Script Web App โดยตรง
  if (typeof google !== 'undefined' && google.script && google.script.run) {
    return new Promise((resolve, reject) => {
      let runner = google.script.run
        .withSuccessHandler(res => resolve(res))
        .withFailureHandler(err => reject(err));

      if (action === 'getAll') runner.getInitialData();
      else if (action === 'uploadFile') runner.uploadFile(params.base64, params.filename, params.mimeType);
      else if (action === 'saveRequest') runner.saveStudentRequest(params.request);
      else if (action === 'updateRequest') runner.updateRequestRow(params.request);
      else if (action === 'adminEditRequest') runner.updateRequestRow(params.request || params);
      else if (action === 'delRequest' || action === 'deleteRequest') runner.deleteRequest(params.id || params.reqId);
      else if (action === 'approveRequest') runner.approveRequest(params.id, params.role, params.approvalData || params, state.user);
      else if (action === 'generateOfficialPDF') runner.generateOfficialPDF(params.id || params.reqId);
      else if (action === 'saveUser') runner.manageUser(params.isEdit ? 'edit' : 'add', params.user);
      else if (action === 'delUser') runner.manageUser('delete', { id: params.id });
      else if (action === 'resetDefaultUsers') runner.resetDefaultUsers();
      else if (action === 'saveSemester') runner.manageSemester('add', params.sem);
      else if (action === 'setCurrentSem') runner.manageSemester('setCurrent', { id: params.id });
      else if (action === 'delSem') runner.manageSemester('delete', { id: params.id });
      else if (action === 'saveClass') runner.manageClass(params.isEdit ? 'edit' : 'add', params.class);
      else if (action === 'delClass') runner.manageClass('delete', { id: params.id });
      else if (action === 'saveTheme') runner.saveThemeSettings(params.theme);
      else runner.getInitialData();
    });
  }

  // 2. ถ้าทำงานบน GitHub Pages หรือเบราว์เซอร์ภายนอก (วาง currentUser ไว้หน้า params เพื่อไม่ให้ทับ params.user)
  if (API_URL && !API_URL.includes('PASTE')) {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action, currentUser: state.user, ...params }),
      redirect: 'follow'
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const j = await res.json();
    if (!j.ok) throw new Error(j.error || 'API error');
    return j;
  }

  throw new Error('กรุณาตั้งค่า API_URL ใน index.html หรือเปิดใช้งานผ่าน Google Apps Script Web App');
}

// ผูกฟังก์ชันเรียก API ให้ใช้ได้ทั้งชื่อ apiCall และ backend
const backend = apiCall;
window.backend = apiCall;
window.apiCall = apiCall;

async function uploadSignature(dataUrl, tag = 'sig') {
  if (!dataUrl || !dataUrl.startsWith('data:')) return dataUrl;
  try {
    const r = await apiCall('uploadFile', {
      base64: dataUrl, mimeType: 'image/png',
      filename: tag + '_' + Date.now() + '.png'
    });
    return r.url || dataUrl;
  } catch (e) {
    console.warn('อัปโหลดรูปลายเซ็นไม่สำเร็จ:', e);
    return dataUrl;
  }
}

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
/**
 * คำนวณปี พ.ศ. ปัจจุบันแบบไดนามิก เริ่มต้นจาก 2569 อัตโนมัติ (เช่น 2569, 2570, 2571...)
 */
function getCurrentBE() {
  const currentAD = new Date().getFullYear();
  return Math.max(2569, currentAD + 543);
}

const fmtDate = ts => {
  if (!ts) return '-';
  const d = new Date(ts);
  return d.toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: 'numeric' }) + ' ' + d.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });
};

const THAI_MONTHS_FULL = [
  'มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน',
  'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'
];

/**
 * แปลงวันที่สอบให้อยู่ในรูปแบบภาษาไทย เช่น 14 ธันวาคม 2569
 */
function formatThaiExamDate(val) {
  if (!val) return '-';
  const str = String(val).trim();
  if (!str) return '-';

  // รูปแบบ ISO หรือ YYYY-MM-DD เช่น 2569-12-14T17:00:00.000Z หรือ 2026-12-14
  const match = str.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (match) {
    let year = parseInt(match[1], 10);
    const month = parseInt(match[2], 10);
    const day = parseInt(match[3], 10);
    if (year < 2400) year += 543;
    const monthName = THAI_MONTHS_FULL[month - 1] || match[2];
    return `${day} ${monthName} ${year}`;
  }

  // รูปแบบ DD/MM/YYYY
  const matchSlash = str.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
  if (matchSlash) {
    const day = parseInt(matchSlash[1], 10);
    const month = parseInt(matchSlash[2], 10);
    let year = parseInt(matchSlash[3], 10);
    if (year < 2400) year += 543;
    const monthName = THAI_MONTHS_FULL[month - 1] || matchSlash[2];
    return `${day} ${monthName} ${year}`;
  }

  return str;
}
const toast = (icon, title) => Swal.fire({ icon, title, toast: true, position: 'top-end', showConfirmButton: false, timer: 2000, timerProgressBar: true });

function shade(hex, pct) {
  const n = parseInt(hex.slice(1), 16); const a = [n >> 16, (n >> 8) & 0xff, n & 0xff];
  return '#' + a.map(v => Math.max(0, Math.min(255, v + Math.round(255 * pct / 100))).toString(16).padStart(2, '0')).join('');
}
function applyTheme() {
  const r = document.documentElement;
  r.style.setProperty('--primary', state.theme.primary);
  r.style.setProperty('--primary-dark', shade(state.theme.primary, -20));
  r.style.setProperty('--secondary', state.theme.secondary);
  r.style.setProperty('--bg', shade(state.theme.primary, 95));
}

// -------------------- APPROVAL QUEUE --------------------
function renderApprovalQueue(role) {
  const roleMap = { teacher: 'pending_teacher', eval: 'pending_eval', deputy: 'pending_deputy' };
  let requests = DB.get('requests', []);
  const semesters = DB.get('semesters', []);
  const classes = DB.get('classes', []);

  // ครูเห็นเฉพาะห้องที่ตนเป็นที่ปรึกษา (ยกเว้นแอดมินดูได้หมด หรือครูที่ยังไม่ได้ผูกห้อง)
  if (role === 'teacher' && state.user && state.user.role !== 'admin') {
    const myClassIds = classes.filter(c => {
      let advs = [];
      if (Array.isArray(c.advisors)) advs = c.advisors;
      else if (typeof c.advisors === 'string') {
        try { advs = JSON.parse(c.advisors); } catch(e) { advs = [c.advisors]; }
      }
      return advs.includes(state.user.id) || (c.advisorNames && c.advisorNames.includes(state.user.fullName));
    }).map(c => c.id);

    if (myClassIds.length > 0) {
      requests = requests.filter(r => myClassIds.includes(r.classId));
    }
  }

  requests = requests.filter(r => r.status === roleMap[role]);
  if (state.filterSem) {
    const [t, y] = state.filterSem.split('_');
    requests = requests.filter(r => r.term == t && r.academicYear == y);
  }
  if (state.filterClass) requests = requests.filter(r => r.classId === state.filterClass);
  if (state.filterSearch) requests = requests.filter(r => (r.firstName + r.lastName).includes(state.filterSearch));
  requests.sort((a, b) => b.createdAt - a.createdAt);

  const total = requests.length;
  const pageSize = state.filterPageSize;
  const totalPages = pageSize === 'all' ? 1 : Math.ceil(total / pageSize) || 1;
  const page = Math.min(state.filterPage, totalPages);
  const start = pageSize === 'all' ? 0 : (page - 1) * pageSize;
  const pageItems = pageSize === 'all' ? requests : requests.slice(start, start + pageSize);

  const rows = pageItems.map(r => `
    <tr class="hover:bg-gray-50">
      <td class="px-3 py-2 border-b border-gray-100 text-xs text-gray-500 whitespace-nowrap">${fmtDate(r.createdAt)}</td>
      <td class="px-3 py-2 border-b border-gray-100 text-sm font-medium">${esc(r.firstName)} ${esc(r.lastName)}</td>
      <td class="px-3 py-2 border-b border-gray-100 text-xs">${esc(r.className)}</td>
      <td class="px-3 py-2 border-b border-gray-100 text-xs">${esc(r.examType)}</td>
      <td class="px-3 py-2 border-b border-gray-100"><span class="text-[11px] px-2 py-0.5 rounded-full bg-${STAGE_INFO[r.status]?.color || 'gray'}-100 text-${STAGE_INFO[r.status]?.color || 'gray'}-700">${STAGE_INFO[r.status]?.label || r.status}</span></td>
      <td class="px-3 py-2 border-b border-gray-100 text-right">
        <button data-action="view-request" data-id="${r.id}" class="px-3 py-1.5 rounded-lg text-xs btn-primary"><i class="fa-solid fa-eye mr-1"></i> ดู/ลงนาม</button>
      </td>
    </tr>`).join('');

  const semOpts = semesters.map(s => `<option value="${s.term}_${s.year}">ภ.${s.term}/${s.year}</option>`).join('');
  const classOpts = classes.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('');

  return `
    <div class="space-y-4">
      <div class="card p-4">
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-2">
          <select data-filter="sem" class="border border-gray-300 rounded-lg px-3 py-2 text-sm focus-primary">
            <option value="">ทุกภาคเรียน</option>${semOpts}
          </select>
          <select data-filter="class" class="border border-gray-300 rounded-lg px-3 py-2 text-sm focus-primary">
            <option value="">ทุกชั้น</option>${classOpts}
          </select>
          <input data-filter="search" placeholder="ค้นหาชื่อนักเรียน..." value="${esc(state.filterSearch)}" class="border border-gray-300 rounded-lg px-3 py-2 text-sm focus-primary">
          <select data-filter="pageSize" class="border border-gray-300 rounded-lg px-3 py-2 text-sm focus-primary">
            ${[10, 25, 50, 100].map(n => `<option value="${n}" ${pageSize == n ? 'selected' : ''}>${n} รายการ</option>`).join('')}
            <option value="all" ${pageSize === 'all' ? 'selected' : ''}>ทั้งหมด</option>
          </select>
        </div>
      </div>
      <div class="card table-wrap">
        <table class="w-full text-sm min-w-[700px]">
          <thead><tr class="bg-gray-50 text-left text-xs font-semibold text-gray-600">
            <th class="px-3 py-2.5">วันที่ส่ง</th><th class="px-3 py-2.5">ชื่อ-นามสกุล</th>
            <th class="px-3 py-2.5">ชั้น</th><th class="px-3 py-2.5">ประเภท</th>

// -------------------- REQUESTS LIST (PUBLIC - ทุกคนเห็นได้) --------------------
function renderRequestsList() {
  let requests = DB.get('requests', []);
  const semesters = DB.get('semesters', []);
  const classes = DB.get('classes', []);

  // ตัวนับสถิติรวม
  const totalAll = requests.length;
  const countApproved = requests.filter(r => r.status === 'complete').length;
  const countRejected = requests.filter(r => r.status === 'rejected').length;
  const countPending = requests.filter(r => r.status !== 'complete' && r.status !== 'rejected').length;

  // กรองตามเงื่อนไข
  if (state.filterSem) {
    const [t, y] = state.filterSem.split('_');
    requests = requests.filter(r => r.term == t && r.academicYear == y);
  }
  if (state.filterClass) {
    requests = requests.filter(r => r.classId === state.filterClass);
  }
  if (state.filterStatus) {
    if (state.filterStatus === 'approved') requests = requests.filter(r => r.status === 'complete');
    else if (state.filterStatus === 'rejected') requests = requests.filter(r => r.status === 'rejected');
    else if (state.filterStatus === 'pending') requests = requests.filter(r => r.status !== 'complete' && r.status !== 'rejected');
  }
  if (state.filterSearch) {
    const q = state.filterSearch.toLowerCase().trim();
    requests = requests.filter(r => 
      (r.firstName + ' ' + r.lastName).toLowerCase().includes(q) || 
      (r.className || '').toLowerCase().includes(q) ||
      (r.examType || '').toLowerCase().includes(q)
    );
  }

  // เรียงลำดับจากรายการล่าสุด
  requests.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

  const total = requests.length;
  const pageSize = state.filterPageSize || 10;
  const totalPages = pageSize === 'all' ? 1 : Math.ceil(total / pageSize) || 1;
  const page = Math.min(state.filterPage || 1, totalPages);
  const start = pageSize === 'all' ? 0 : (page - 1) * pageSize;
  const pageItems = pageSize === 'all' ? requests : requests.slice(start, start + pageSize);

  const semOpts = semesters.map(s => `<option value="${s.term}_${s.year}" ${state.filterSem === `${s.term}_${s.year}` ? 'selected' : ''}>ภ.${s.term}/${s.year}</option>`).join('');
  const classOpts = classes.map(c => `<option value="${c.id}" ${state.filterClass === c.id ? 'selected' : ''}>${esc(c.name)}</option>`).join('');

  const rows = pageItems.map(r => {
    // สถานะตามเงื่อนไขที่กำหนด:
    // 1. สีเขียว "อนุมัติ" เมื่อ ครู, วัดและประเมินผล, รองผู้อำนวยการ อนุมัติและเซ็นครบ (status === 'complete')
    // 2. สีแดง "ไม่อนุมัติ" ถ้ามีคนใดคนหนึ่งไม่อนุมัติ (status === 'rejected')
    // 3. กำลังดำเนินการ ถ้าอยู่ระหว่างรอครู / รอวัดผล / รอรองฯ
    let statusBadge = '';
    let pdfBtn = '';

    if (r.status === 'complete') {
      statusBadge = `<span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold bg-emerald-100 text-emerald-800 border border-emerald-300 shadow-sm"><i class="fa-solid fa-circle-check text-emerald-600"></i> อนุมัติ</span>`;
      
      if (r.pdfUrl) {

            <i class="fa-solid fa-file-pdf"></i> เอกสาร PDF

    } else if (r.status === 'rejected') {

          <div class="inline-flex items-center gap-1.5 justify-end">
            <button data-action="view-request" data-id="${r.id}" class="px-2.5 py-1.5 rounded-lg text-xs bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold transition" title="ดูรายละเอียดคำร้องและลายเซ็น">

                <i class="fa-solid fa-trash mr-1"></i> ลบ
              </button>
            ` : ''}
          </div>
        </td>
      </tr>`;
  }).join('');

  return `
    <div class="space-y-4">
      <!-- บัตรสรุปภาพรวม -->

let sigTarget = null;
function openSignatureModal(target) {
  sigTarget = target;
  Swal.fire({
    title: '<span style="font-size:1.1rem">ลายเซ็น</span>',
    html: `
      <div class="flex gap-2 mb-3 justify-center">
        <button type="button" id="sigTabDraw" class="px-3 py-1.5 rounded-lg text-xs font-medium bg-emerald-500 text-white">✍ วาดลายเซ็น</button>
        <button type="button" id="sigTabUpload" class="px-3 py-1.5 rounded-lg text-xs font-medium bg-gray-100 text-gray-700">⬆ อัปโหลดรูปภาพ</button>
      </div>
      <div id="sigDrawPane">
        <canvas id="sigCanvas" width="460" height="200"></canvas>
        <div class="flex gap-2 justify-center mt-2"><button type="button" id="sigClear" class="px-3 py-1.5 rounded-lg bg-gray-100 text-xs hover:bg-gray-200">ล้างกระดาน</button></div>
      </div>
      <div id="sigUploadPane" style="display:none">
        <input type="file" id="sigFile" accept="image/png,image/jpeg" class="text-sm">
        <p class="text-xs text-gray-500 mt-2">ระบบจะลบพื้นหลังขาวโดยอัตโนมัติให้โปร่งใส</p>
        <div id="sigUploadPreview" class="mt-3 flex justify-center"></div>
      </div>
    `,
    showCancelButton: true, confirmButtonText: 'บันทึก', cancelButtonText: 'ยกเลิก',
    confirmButtonColor: state.theme.primary,
    didOpen: () => {
      const canvas = document.getElementById('sigCanvas');
      const ctx = canvas.getContext('2d');
      ctx.lineWidth = 2.5; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#1f2937';
      let drawing = false, lastX = 0, lastY = 0;
      const pos = e => {
        const r = canvas.getBoundingClientRect();
        const t = e.touches ? e.touches[0] : e;
        return { x: (t.clientX - r.left) * (canvas.width / r.width), y: (t.clientY - r.top) * (canvas.height / r.height) };
      };
      const start = e => { e.preventDefault(); drawing = true; const p = pos(e); lastX = p.x; lastY = p.y; };
      const move = e => { if (!drawing) return; e.preventDefault(); const p = pos(e); ctx.beginPath(); ctx.moveTo(lastX, lastY); ctx.lineTo(p.x, p.y); ctx.stroke(); lastX = p.x; lastY = p.y; };
      const end = () => { drawing = false; };
      canvas.addEventListener('mousedown', start); canvas.addEventListener('mousemove', move);
      canvas.addEventListener('mouseup', end); canvas.addEventListener('mouseleave', end);
      canvas.addEventListener('touchstart', start); canvas.addEventListener('touchmove', move); canvas.addEventListener('touchend', end);

      document.getElementById('sigClear').onclick = () => ctx.clearRect(0, 0, canvas.width, canvas.height);
      document.getElementById('sigTabDraw').onclick = () => {
        document.getElementById('sigDrawPane').style.display = 'block';
        document.getElementById('sigUploadPane').style.display = 'none';
        document.getElementById('sigTabDraw').className = 'px-3 py-1.5 rounded-lg text-xs font-medium bg-emerald-500 text-white';
        document.getElementById('sigTabUpload').className = 'px-3 py-1.5 rounded-lg text-xs font-medium bg-gray-100 text-gray-700';
      };
      document.getElementById('sigTabUpload').onclick = () => {
        document.getElementById('sigDrawPane').style.display = 'none';
        document.getElementById('sigUploadPane').style.display = 'block';
        document.getElementById('sigTabUpload').className = 'px-3 py-1.5 rounded-lg text-xs font-medium bg-emerald-500 text-white';
        document.getElementById('sigTabDraw').className = 'px-3 py-1.5 rounded-lg text-xs font-medium bg-gray-100 text-gray-700';
      };
      document.getElementById('sigFile').onchange = async (e) => {
        const file = e.target.files[0]; if (!file) return;
        const reader = new FileReader();
        reader.onload = ev => {
          const img = new Image();
          img.onload = () => {
            const processed = removeWhiteBackground(img);
            document.getElementById('sigUploadPreview').innerHTML = `<img src="${processed}" style="max-height:120px;max-width:100%">`;
            document.getElementById('sigUploadPreview').dataset.url = processed;
          };
          img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
      };
    },
    preConfirm: () => {
      const drawPane = document.getElementById('sigDrawPane');
      if (drawPane.style.display !== 'none') {
        const canvas = document.getElementById('sigCanvas');
        const data = cropSignatureCanvas(canvas);
        if (!data || data.length < 500) return Swal.showValidationMessage('กรุณาวาดลายเซ็นก่อน');
        return data;
      } else {
        const prev = document.getElementById('sigUploadPreview');
        if (!prev.dataset.url) return Swal.showValidationMessage('กรุณาอัปโหลดรูปภาพ');
        return prev.dataset.url;
      }
    }
  }).then(r => {
    if (r.isConfirmed && r.value) {
      window._lastSig = r.value;
      if (sigTarget === 'student') {
        document.getElementById('studentSignature').value = r.value;
        document.getElementById('studentSigPreview').innerHTML = `<img src="${r.value}" style="max-height:48px;max-width:100%;object-fit:contain">`;
      } else if (sigTarget === 'approver') {
        window._sigTemp = r.value;
        const preview = document.getElementById('signPreview');
        if (preview) preview.innerHTML = `<img src="${r.value}" style="max-height:48px;max-width:100%;object-fit:contain">`;
      }
    }
  });
}

/**
 * ตัดขอบว่างโปร่งใสและพื้นขาวรอบลายเซ็น (Crop to Content)
 * ทำให้ได้ภาพลายเซ็นที่มีเฉพาะเส้นหมึกพอดีกรอบ ไม่ล้น ไม่ตกขอบ
 */
// ============================================================
// SIGNATURE: Normalize ให้ขนาดคงที่ + ตำแหน่งเดิมทุกครั้ง
// ============================================================
const SIG_NORM_W = 160;   // ความกว้างมาตรฐาน (px)
const SIG_NORM_H = 50;   // ความสูงมาตรฐาน (px)
const SIG_NORM_PAD = 4;   // ระยะขอบภายใน (px)

/**
 * cropSignatureCanvas(c, targetW, targetH)
 * 1) ตรวจจับพื้นที่หมึก (bounding box)
 * 2) crop เฉพาะบริเวณที่มีหมึก
 * 3) ย่อ/ขยายให้พอดี + จัดกึ่งกลางใน canvas ขนาดคงที่
 * => ลายเซ็นทุกอันจะมีขนาดเท่ากันและตำแหน่งเดียวกันเสมอ
 */
function cropSignatureCanvas(c, targetW = SIG_NORM_W, targetH = SIG_NORM_H) {
  if (!c) return null;
  const ctx = c.getContext('2d');
  const w = c.width, h = c.height;
  if (!w || !h) return null;

  const imgData = ctx.getImageData(0, 0, w, h);
  const data = imgData.data;
  let minX = w, minY = h, maxX = 0, maxY = 0;
  let hasInk = false;

  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const idx = (y * w + x) * 4;
      const alpha = data[idx + 3];
      const r = data[idx], g = data[idx + 1], b = data[idx + 2];
      // หมึก = ไม่โปร่งใส + ไม่ใช่พื้นขาวล้วน
      if (alpha > 25 && !(r > 235 && g > 235 && b > 235)) {
        hasInk = true;
        if (x < minX) minX = x;
        if (x > maxX) maxX = x;
        if (y < minY) minY = y;
        if (y > maxY) maxY = y;
      }
    }
  }

  // ไม่มีหมึก → คืน null (ให้ผู้เรียกฟังก์ชันแจ้งเตือน)
  if (!hasInk || maxX <= minX || maxY <= minY) return null;

  // 1) Crop เฉพาะบริเวณหมึก (padding รอบนอกนิดหน่อย)
  const pad = 3;
  const startX = Math.max(0, minX - pad);
  const startY = Math.max(0, minY - pad);
  const cropW = Math.min(w - startX, (maxX - minX) + pad * 2);
  const cropH = Math.min(h - startY, (maxY - minY) + pad * 2);

  const cropped = document.createElement('canvas');
  cropped.width = cropW;
  cropped.height = cropH;
  cropped.getContext('2d').drawImage(c, startX, startY, cropW, cropH, 0, 0, cropW, cropH);

  // 2) Normalize → fixed canvas (scale to fit + center)
  const normalized = document.createElement('canvas');
  normalized.width = targetW;
  normalized.height = targetH;
  const nCtx = normalized.getContext('2d');

  const availW = targetW - SIG_NORM_PAD * 2;
  const availH = targetH - SIG_NORM_PAD * 2;
  const scale = Math.min(availW / cropW, availH / cropH);
  const drawW = cropW * scale;
  const drawH = cropH * scale;
  const drawX = (targetW - drawW) / 2;
  const drawY = (targetH - drawH) / 2;

  nCtx.imageSmoothingEnabled = true;
  nCtx.imageSmoothingQuality = 'high';
  nCtx.drawImage(cropped, 0, 0, cropW, cropH, drawX, drawY, drawW, drawH);

  return normalized.toDataURL('image/png');
}

function removeWhiteBackground(img) {
  const c = document.createElement('canvas');
  c.width = img.width; c.height = img.height;
  const ctx = c.getContext('2d');
  ctx.drawImage(img, 0, 0);
  const imgData = ctx.getImageData(0, 0, c.width, c.height);
  const data = imgData.data;
  for (let i = 0; i < data.length; i += 4) {
    const r = data[i], g = data[i + 1], b = data[i + 2];
    if (r > 235 && g > 235 && b > 235) {
      data[i + 3] = 0; // ทำพื้นหลังขาวโปร่งใส
    }
  }
  ctx.putImageData(imgData, 0, 0);
  // ใช้ crop + normalize ขนาดคงที่ (ถ้าไม่มีเนื้อหาให้คืนภาพเดิม)
  return cropSignatureCanvas(c) || c.toDataURL('image/png');
}

// ============================================================
// HELPER: DIRECT DRIVE IMAGE URL (แปลงลิงก์ Drive เป็นรูปภาพตรง)
// ============================================================
function formatSigUrl(url) {
  if (!url) return '';
  const str = String(url).trim();
  if (!str) return '';
  if (str.startsWith('data:image/')) return str;
  const match = str.match(/[-\w]{25,}/);
  if (match) {
    return `https://lh3.googleusercontent.com/d/${match[0]}`;
  }
  return str;
}

    didOpen: () => {
      if (!canSign) return;
      const canvas = document.getElementById('apprSigCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      ctx.lineWidth = 2.5;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.strokeStyle = '#1e293b';

      let drawing = false;
      let lastX = 0, lastY = 0;
      window._hasDrawnAppr = false;

      const getPos = e => {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
          x: (clientX - rect.left) * (canvas.width / rect.width),
          y: (clientY - rect.top) * (canvas.height / rect.height)
        };
      };

      const start = e => {
        e.preventDefault();
        drawing = true;
        window._hasDrawnAppr = true;
        const p = getPos(e);
        lastX = p.x; lastY = p.y;
      };

      const move = e => {
        if (!drawing) return;
        e.preventDefault();
        const p = getPos(e);
        ctx.beginPath();
        ctx.moveTo(lastX, lastY);
        ctx.lineTo(p.x, p.y);
        ctx.stroke();
        lastX = p.x; lastY = p.y;
      };

      const end = () => { drawing = false; };

      canvas.addEventListener('mousedown', start);
      canvas.addEventListener('mousemove', move);
      canvas.addEventListener('mouseup', end);
      canvas.addEventListener('mouseleave', end);

      canvas.addEventListener('touchstart', start, { passive: false });
      canvas.addEventListener('touchmove', move, { passive: false });
      canvas.addEventListener('touchend', end, { passive: false });

      // ปุ่มล้างกระดาน
      const btnClear = document.getElementById('btnClearApprCanvas');
      if (btnClear) {
        btnClear.onclick = () => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          window._hasDrawnAppr = false;
        };
      }

      // สลับแท็บวาด / อัปโหลด
      const tabDraw = document.getElementById('tabApprDraw');
      const tabUpload = document.getElementById('tabApprUpload');
      const paneDraw = document.getElementById('paneApprDraw');
      const paneUpload = document.getElementById('paneApprUpload');

      if (tabDraw && tabUpload) {
        tabDraw.onclick = () => {
          paneDraw.style.display = 'block';

          tabDraw.className = 'px-2.5 py-1 rounded-md font-medium text-gray-600 hover:text-gray-900 transition';
        };
      }

      // จัดการอัปโหลดไฟล์ภาพ
      const fileInput = document.getElementById('apprSigFileInput');
      const previewBox = document.getElementById('apprSigFilePreview');

      if (fileInput) {
        fileInput.onchange = e => {
          const file = e.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = ev => {
            const img = new Image();
            img.onload = () => {
              const processed = removeWhiteBackground(img);
              window._apprUploadedSig = processed;
              if (previewBox) {
                previewBox.innerHTML = `<img src="${processed}" style="max-height:48px;max-width:130px;object-fit:contain" class="shadow-sm border rounded bg-white p-1">`;
              }
            };
            img.src = ev.target.result;
          };
          reader.readAsDataURL(file);
        };
      }
    },
    preConfirm: () => {
      if (!canSign) return;
      const approveEl = document.querySelector('input[name="apprChoice"]:checked');
      const approve = approveEl ? approveEl.value : 'approve';
      const note = document.getElementById('apprNoteText')?.value.trim() || '';

      let sig = null;

        if (!sig) return Swal.showValidationMessage('กรุณาเลือกไฟล์รูปภาพลายเซ็น');
      } else {
        const canvas = document.getElementById('apprSigCanvas');
        if (canvas) {
          if (!window._hasDrawnAppr) {
            return Swal.showValidationMessage('กรุณาวาดลายเซ็นก่อนกดยืนยัน');
          }
          const testData = cropSignatureCanvas(canvas);
          if (!testData || testData.length < 500) {
            return Swal.showValidationMessage('กรุณาวาดลายเซ็นก่อนกดยืนยัน');
          }
          sig = testData;
        }
      }

      if (!sig) return Swal.showValidationMessage('กรุณาลงลายเซ็นก่อนกดยืนยัน');

      return { approve, note, sig, activeRole };
    }
  }).then(r => {
    if (r.isConfirmed && r.value) {
      applyApproval(reqId, r.value.activeRole, r.value);
    }
  });
}

async function applyApproval(reqId, role, { approve, note, sig }) {
  Swal.fire({
    title: 'กำลังบันทึกการอนุมัติ...',
    html: 'กำลังบันทึกลายเซ็นและอัปเดตขั้นตอนใน Google Sheet',
    didOpen: () => Swal.showLoading(),
    allowOutsideClick: false
  });

  try {
    const res = await apiCall('approveRequest', {
      id: reqId,
      reqId: reqId,
      role: role,
      approvalData: {
        approve: approve,
        note: note,
        sig: sig,
        approverName: state.user?.fullName || ''
      },
      approverUser: state.user
    });

    await DB.load();

    const roleName = ROLE_LABELS[role] || role;
    const isApproved = approve === 'approve';
    let msgHtml = `<p class="text-sm text-gray-600 mb-2">${isApproved ? 'บันทึกการพิจารณาอนุมัติเรียบร้อยแล้ว' : 'บันทึกการไม่อนุมัติเรียบร้อยแล้ว'}</p>`;

    if (res.pdfUrl) {
      msgHtml += `<div class="mt-3 p-3 ${isApproved ? 'bg-emerald-50 border-emerald-200' : 'bg-red-50 border-red-200'} rounded-lg border">
        <p class="text-xs ${isApproved ? 'text-emerald-800' : 'text-red-800'} font-semibold mb-2">${isApproved ? '🎉 อนุมัติครบทุกขั้นตอนแล้ว (สร้างเอกสารทางการเสร็จสิ้น)' : '⚠️ บันทึกผลการไม่อนุมัติและจัดทำเอกสาร PDF เรียบร้อยแล้ว'}</p>
        <a href="${res.pdfUrl}" target="_blank" class="inline-flex items-center gap-1.5 px-4 py-2 ${isApproved ? 'bg-emerald-600 hover:bg-emerald-700' : 'bg-red-600 hover:bg-red-700'} text-white rounded-lg text-xs font-semibold shadow-sm transition">
          <i class="fa-solid fa-file-pdf"></i> เปิดเอกสาร PDF (Google Drive)
        </a>
      </div>`;
    }

    Swal.fire({
      icon: isApproved ? 'success' : 'info',
      title: isApproved ? `อนุมัติสำเร็จ (${roleName})` : `ไม่อนุมัติ (${roleName})`,
      html: msgHtml,
      confirmButtonText: 'ตกลง',
      confirmButtonColor: state.theme.primary
    });

    renderApp();
  } catch (err) {
    console.error('applyApproval error:', err);
    Swal.fire('เกิดข้อผิดพลาดในการบันทึก', err.message, 'error');
  }
}

// ============================================================
// เอกสารทางการ PDF (สร้างจาก Google Slide Template เท่านั้น)
// ============================================================
async function openOfficialPDF(reqId) {
  const req = DB.get('requests', []).find(r => r.id === reqId);
  if (!req) return;

  // 1. ถ้ามี URL เอกสาร PDF ทางการใน Google Drive แล้ว ให้เปิดทันที
  if (req.pdfUrl) {
    window.open(req.pdfUrl, '_blank');
    return;
  }

  // 2. ถ้ายังอยู่ระหว่างการพิจารณา (ยังไม่เสร็จสิ้นและยังไม่มีผู้พิจารณาไม่อนุมัติ)
  if (req.status !== 'complete' && req.status !== 'rejected') {
    Swal.fire({
      icon: 'info',
      title: 'อยู่ระหว่างดำเนินการ',
      text: 'เอกสารคำร้องทางการจะออกให้เมื่อได้รับการพิจารณาและลงนามในระบบ'
    });
    return;
  }

  // 4. ถ้าอนุมัติครบแล้วแต่ยังไม่มี PDF ให้สั่งระบบ Backend สร้างจาก Google Slide Template
  Swal.fire({
    title: 'กำลังจัดทำเอกสาร PDF ทางการ...',
    html: 'ระบบกำลังดึงข้อมูลลงใน Google Slide Template และบันทึกลง Google Drive<br>กรุณารอสักครู่...',
    didOpen: () => Swal.showLoading(),
    allowOutsideClick: false
  });

  try {
    const res = await apiCall('generateOfficialPDF', { id: reqId });
    if (res && res.pdfUrl) {
      req.pdfUrl = res.pdfUrl;
      req.slideUrl = res.slideUrl;
      const all = DB.get('requests', []);
      const idx = all.findIndex(x => x.id === reqId);
      if (idx !== -1) {
        all[idx] = req;
        DB.set('requests', all);
      }
      Swal.close();
      window.open(res.pdfUrl, '_blank');
      render();
    } else {
      throw new Error(res?.error || 'ไม่สามารถสร้างเอกสาร PDF ได้');
    }
  } catch (err) {
    Swal.fire('เกิดข้อผิดพลาด', err.message, 'error');
  }
}
window.openOfficialPDF = openOfficialPDF;
window.downloadPDF = openOfficialPDF;

// EVENT LISTENERS

document.addEventListener('click', async e => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const action = el.dataset.action;
  const id = el.dataset.id;

  if (action === 'nav') { e.preventDefault(); navigate(el.dataset.page); return; }
  if (action === 'toggle-sidebar') {
    if (window.innerWidth < 1024) {
      state.sidebarOpen = !state.sidebarOpen;
    } else {
      state.sidebarCollapsed = !state.sidebarCollapsed;
    }
    renderApp();
    return;
  }
  if (action === 'open-sidebar') { state.sidebarOpen = true; renderApp(); return; }
  if (action === 'close-sidebar') { state.sidebarOpen = false; renderApp(); return; }
  if (action === 'admin-edit-req') { openAdminEditRequest(id); return; }
  if (action === 'admin-del-req') { adminDeleteRequest(id); return; }
  if (action === 'open-login') { openLoginModal(); return; }
  if (action === 'refresh') {
    state.loading = true; renderApp();
    try { await DB.load(); toast('success', 'อัปเดตข้อมูลจาก Google Sheet แล้ว'); } catch (e) { toast('error', e.message); }
    state.loading = false; renderApp(); return;
  }
  if (action === 'logout') {
    Swal.fire({ title: 'ออกจากระบบ?', icon: 'question', showCancelButton: true, confirmButtonText: 'ออกจากระบบ', cancelButtonText: 'ยกเลิก', confirmButtonColor: '#ef4444' })
      .then(r => { if (r.isConfirmed) { logout(); renderApp(); toast('success', 'ออกจากระบบแล้ว'); } });
    return;
  }
  if (action === 'open-signature') { openSignatureModal(el.dataset.target); return; }
  if (action === 'add-subject') { addSubjectRow(); return; }
  if (action === 'remove-subject') { el.closest('tr').remove(); return; }
  if (action === 'reset-form') {
    document.getElementById('studentForm')?.reset();
    initSubjects();
    document.getElementById('studentSigPreview').innerHTML = 'ยังไม่มีลายเซ็น';
    document.getElementById('studentSignature').value = '';
    document.getElementById('sigNamePreview').textContent = '-';
    return;
  }

  // Admin Users
  if (action === 'add-user') { openUserForm(); return; }
  if (action === 'edit-user') { openUserForm(id); return; }
  if (action === 'del-user') {
    Swal.fire({ title: 'ลบผู้ใช้?', icon: 'warning', showCancelButton: true, confirmButtonText: 'ลบ', cancelButtonText: 'ยกเลิก', confirmButtonColor: '#ef4444' })
      .then(async r => {
        if (r.isConfirmed) {
          try {
            await apiCall('delUser', { id });
            await DB.load();
            toast('success', 'ลบผู้ใช้แล้ว'); renderApp();
          } catch (e) { Swal.fire('ผิดพลาด', e.message, 'error'); }
        }
      });
    return;
  }

  // Reset default users
  if (action === 'reset-default-users') {
    Swal.fire({
      title: 'รีเซ็ตบัญชีผู้ใช้เริ่มต้น?',
      html: `ระบบจะสร้างและกู้คืนบัญชีผู้ใช้เริ่มต้นครบทั้ง 5 บทบาท:<br>
      • <b>admin</b> (ผู้ดูแลระบบ)<br>
      • <b>teacher</b> (ครูสมศรี ที่ปรึกษา ม.1/1)<br>
      • <b>teacher2</b> (ครูสมชาย ที่ปรึกษา ม.1/2)<br>
      • <b>eval</b> (หัวหน้างานวัดและประเมินผล)<br>
      • <b>deputy</b> (รองผู้อำนวยการฝ่ายวิชาการ)`,
      icon: 'question',
      showCancelButton: true,
      confirmButtonText: 'ยืนยันรีเซ็ต',
      cancelButtonText: 'ยกเลิก',
      confirmButtonColor: state.theme.primary
    }).then(async r => {
      if (r.isConfirmed) {
        Swal.fire({ title: 'กำลังรีเซ็ตบัญชีเริ่มต้น...', didOpen: () => Swal.showLoading(), allowOutsideClick: false });
        try {
          await apiCall('resetDefaultUsers');
          await DB.load();
          Swal.close();
          toast('success', 'รีเซ็ตบัญชีผู้ใช้เริ่มต้นเรียบร้อย');
          renderApp();
        } catch (e) {
          Swal.fire('ผิดพลาด', e.message, 'error');
        }
      }
    });
    return;
  }

  // Admin Semesters
  if (action === 'add-sem') { openSemForm(); return; }
  if (action === 'set-current-sem') {
    try {
      await apiCall('setCurrentSem', { id });
      await DB.load();
      toast('success', 'ตั้งเป็นภาคเรียนปัจจุบันแล้ว'); renderApp();
    } catch (e) { Swal.fire('ผิดพลาด', e.message, 'error'); }
    return;
  }
  if (action === 'del-sem') {
    Swal.fire({ title: 'ลบภาคเรียน?', icon: 'warning', showCancelButton: true, confirmButtonText: 'ลบ', cancelButtonText: 'ยกเลิก', confirmButtonColor: '#ef4444' })
      .then(async r => {
        if (r.isConfirmed) {
          try {
            await apiCall('delSem', { id });
            await DB.load();
            toast('success', 'ลบภาคเรียนแล้ว'); renderApp();
          } catch (e) { Swal.fire('ผิดพลาด', e.message, 'error'); }
        }
      });
    return;
  }

  // Admin Classes
  if (action === 'add-class') { openClassForm(); return; }
  if (action === 'edit-class') { openClassForm(id); return; }
  if (action === 'del-class') {
    Swal.fire({ title: 'ลบชั้นเรียน?', icon: 'warning', showCancelButton: true, confirmButtonText: 'ลบ', cancelButtonText: 'ยกเลิก', confirmButtonColor: '#ef4444' })
      .then(async r => {
        if (r.isConfirmed) {
          try {
            await apiCall('delClass', { id });
            await DB.load();
            toast('success', 'ลบชั้นเรียนแล้ว'); renderApp();
          } catch (e) { Swal.fire('ผิดพลาด', e.message, 'error'); }
        }
      });
    return;
  }

  // View request
  if (action === 'view-request') { openRequestDetail(id); return; }

  // Theme settings
  if (action === 'save-theme') {
    state.theme = { primary: document.getElementById('colorPrimary').value, secondary: document.getElementById('colorSecondary').value };
    try {
      await apiCall('saveTheme', { theme: state.theme });
      applyTheme(); toast('success', 'บันทึกธีมแล้ว'); renderApp();
    } catch (e) { Swal.fire('ผิดพลาด', e.message, 'error'); }
    return;
  }
  if (action === 'reset-theme') {
    state.theme = { primary: '#10b981', secondary: '#fbbf24' };
    try {
      await apiCall('saveTheme', { theme: state.theme });
      applyTheme(); toast('success', 'รีเซ็ตธีมแล้ว'); renderApp();
    } catch (e) { Swal.fire('ผิดพลาด', e.message, 'error'); }
    return;
  }

  // Pagination
  if (action === 'page-prev') { state.filterPage = Math.max(1, (state.filterPage || 1) - 1); renderApp(); return; }
  if (action === 'page-next') { state.filterPage = (state.filterPage || 1) + 1; renderApp(); return; }
});

// LOGIN MODAL (พร้อมตัวเลือกจดจำ Username และ Password)
// ============================================================
function openLoginModal() {
  let saved = null;
  try {
    saved = JSON.parse(localStorage.getItem('sv01_remember') || 'null');
  } catch (e) {}

  Swal.fire({
    title: '<span class="text-lg font-bold text-gray-800">เข้าสู่ระบบเจ้าหน้าที่ / ครู</span>',
    html: `
      <div class="space-y-3.5 text-left pt-2 px-1">
        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">ชื่อผู้ใช้ (Username)</label>
          <input id="loginUser" value="${saved?.username ? esc(saved.username) : ''}" placeholder="ระบุชื่อผู้ใช้ เช่น admin, teacher, eval, deputy" class="w-full px-3.5 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 font-mono" autocomplete="username">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">รหัสผ่าน (Password)</label>
          <input id="loginPass" type="password" value="${saved?.password ? esc(saved.password) : ''}" placeholder="ระบุรหัสผ่าน" class="w-full px-3.5 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500" autocomplete="current-password">
        </div>
        <div class="flex items-center gap-2 pt-1">
          <input type="checkbox" id="rememberMe" ${saved?.remember ? 'checked' : ''} class="w-4 h-4 text-emerald-600 rounded border-gray-300 focus:ring-emerald-500 cursor-pointer">
          <label for="rememberMe" class="text-xs text-gray-700 font-medium cursor-pointer select-none">จดจำ Username และ Password ในเครื่องนี้</label>
        </div>
      </div>
    `,
    width: '420px',
    confirmButtonText: 'เข้าสู่ระบบ',
    cancelButtonText: 'ยกเลิก',
    showCancelButton: true,
    confirmButtonColor: state.theme.primary,
    preConfirm: () => {
      const u = document.getElementById('loginUser').value.trim();
      const p = document.getElementById('loginPass').value;
      const rem = document.getElementById('rememberMe').checked;

      if (!u || !p) {
        Swal.showValidationMessage('กรุณากรอก Username และ Password ให้ครบถ้วน');
        return false;
      }
      if (!login(u, p)) {
        Swal.showValidationMessage('Username หรือ Password ไม่ถูกต้อง');
        return false;
      }

      // บันทึกหรือลบข้อมูลการจดจำ
      if (rem) {
        try {
          localStorage.setItem('sv01_remember', JSON.stringify({ username: u, password: p, remember: true }));
        } catch (e) {}
      } else {
        try {
          localStorage.removeItem('sv01_remember');
        } catch (e) {}
      }

      return true;
    }
  }).then(r => {
    if (r.isConfirmed) {
      toast('success', 'เข้าสู่ระบบสำเร็จ');
      state.page = state.user.role === 'admin' ? 'home' : state.user.role;
      renderApp();
    }
  });
}

      Swal.fire({ title: 'กำลังบันทึกภาคเรียน...', didOpen: () => Swal.showLoading(), allowOutsideClick: false });
      try {
        await apiCall('saveSemester', { sem: { id: ('sem_' + Date.now()), ...r.value, current: false } });
        await DB.load();
        Swal.close();
        toast('success', 'เพิ่มภาคเรียนสำเร็จ');
        renderApp();
      } catch (e) {
        Swal.fire('ผิดพลาด', e.message, 'error');
      }
    }
  });
}

// ============================================================
// CLASS FORM MODAL
// ============================================================
function openClassForm(id) {
  const classes = DB.get('classes', []);
  const users = DB.get('users', []);
  const teachers = users.filter(u => u.role === 'teacher');
  const c = (id ? classes.find(x => x.id === id) : null) || { name: '', advisors: [], advisorNames: '' };

  let currentAdvisors = [];
  if (Array.isArray(c.advisors)) {
    currentAdvisors = c.advisors;
  } else if (typeof c.advisors === 'string') {
    try { currentAdvisors = JSON.parse(c.advisors); } catch(e) { currentAdvisors = c.advisors ? [c.advisors] : []; }
  }

  Swal.fire({
    title: id ? 'แก้ไขชั้นเรียน' : 'เพิ่มชั้นเรียนใหม่',
    html: `
      <div class="text-left space-y-3">
        <div>
          <label class="text-xs font-semibold text-gray-700 block mb-1">ชื่อชั้นเรียน (เช่น ม.1/1, ม.4/1)</label>
          <input id="cf_name" placeholder="เช่น ม.1/1" value="${esc(c.name || '')}" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus-primary">
        </div>
        <div>
          <label class="text-xs font-semibold text-gray-700 block mb-1">เลือกครูที่ปรึกษาประจำชั้น (เลือกได้มากกว่า 1 ท่าน)</label>
          <div class="max-h-52 overflow-y-auto border border-gray-200 rounded-lg p-2 bg-gray-50 space-y-1">
            ${teachers.length ? teachers.map(t => `
              <label class="flex items-center gap-2 p-1.5 hover:bg-white rounded-lg cursor-pointer text-sm border border-transparent hover:border-gray-200 transition">
                <input type="checkbox" value="${t.id}" ${currentAdvisors.includes(t.id) ? 'checked' : ''} class="cf_adv rounded text-emerald-600 w-4 h-4">
                <div class="flex-1">
                  <span class="font-medium text-gray-800">${esc(t.fullName)}</span>
                  ${t.position ? `<small class="text-gray-500 ml-1">(${esc(t.position)})</small>` : ''}
                </div>
              </label>
            `).join('') : '<div class="text-xs text-amber-600 p-2.5 bg-amber-50 rounded border border-amber-200"><i class="fa-solid fa-triangle-exclamation mr-1"></i>ยังไม่มีครูในระบบ กรุณาเพิ่มครูในเมนู "ผู้ใช้งาน" ก่อน</div>'}
          </div>
        </div>
      </div>
    `,
    width: '460px',
    showCancelButton: true, confirmButtonText: 'บันทึก', cancelButtonText: 'ยกเลิก',
    confirmButtonColor: state.theme.primary,
    preConfirm: () => {
      const name = document.getElementById('cf_name').value.trim();
      if (!name) return Swal.showValidationMessage('กรุณากรอกชื่อชั้นเรียน');
      const advisors = [...document.querySelectorAll('.cf_adv:checked')].map(x => x.value);
      const advisorNames = advisors.map(aid => teachers.find(t => t.id === aid)?.fullName).filter(Boolean).join(', ');
      return { name, advisors, advisorNames };
    }
  }).then(async r => {
    if (r.isConfirmed && r.value) {
      Swal.fire({ title: 'กำลังบันทึกข้อมูลชั้นเรียน...', didOpen: () => Swal.showLoading(), allowOutsideClick: false });
      try {
        await apiCall('saveClass', { class: { id: id || ('c_' + Date.now()), ...r.value }, isEdit: !!id });
        await DB.load();
        Swal.close();
        toast('success', id ? 'แก้ไขชั้นเรียนเรียบร้อย' : 'เพิ่มชั้นเรียนสำเร็จ');
        renderApp();
      } catch (e) {
        Swal.fire('ผิดพลาด', e.message, 'error');
      }
    }
  });
}

// ============================================================
// SUBJECT ROWS
// ============================================================
let subjectCount = 0;
function initSubjects() {
  subjectCount = 0;
  const tbody = document.getElementById('subjectRows');
  if (!tbody) return;
  tbody.innerHTML = '';
  for (let i = 0; i < 3; i++) addSubjectRow();
}
function addSubjectRow() {
  const tbody = document.getElementById('subjectRows');
  if (!tbody) return;
  if (subjectCount >= 7) { toast('warning', 'สามารถเพิ่มได้สูงสุด 7 รายวิชา'); return; }
  const idx = subjectCount++;
  tbody.insertAdjacentHTML('beforeend', renderSubjectRow(idx));
}

// ============================================================
// FILTER EVENTS
// ============================================================
document.addEventListener('change', e => {
  const f = e.target.dataset.filter;
  if (!f) return;
  if (f === 'sem') state.filterSem = e.target.value;
  else if (f === 'class') state.filterClass = e.target.value;
  else if (f === 'status') { state.filterStatus = e.target.value; state.filterPage = 1; }
  else if (f === 'pageSize') { state.filterPageSize = e.target.value === 'all' ? 'all' : +e.target.value; state.filterPage = 1; }
  renderApp();
});
document.addEventListener('input', e => {
  if (e.target.dataset.filter === 'search') {
    state.filterSearch = e.target.value;
    state.filterPage = 1;
    clearTimeout(window._searchTimer);
    window._searchTimer = setTimeout(() => renderApp(), 300);
  }
  if (e.target.name === 'firstName' || e.target.name === 'lastName') {
    const f = document.querySelector('[name=firstName]')?.value || '';
    const l = document.querySelector('[name=lastName]')?.value || '';
    const p = document.getElementById('sigNamePreview');
    if (p) p.textContent = (f + ' ' + l).trim() || '-';
  }
});

// ============================================================
// STUDENT FORM SUBMISSION
// ============================================================
document.addEventListener('submit', async e => {
  if (e.target.id !== 'studentForm') return;
  e.preventDefault();
  const fd = new FormData(e.target);
  const sig = document.getElementById('studentSignature').value;
  if (!sig) { Swal.fire('แจ้งเตือน', 'กรุณาลงลายเซ็นนักเรียนก่อนส่งคำร้อง', 'warning'); return; }

  const classes = DB.get('classes', []);
  const classId = fd.get('classId');
  const cls = classes.find(c => c.id === classId);
  if (!cls || !cls.advisors || cls.advisors.length === 0) {
    Swal.fire('แจ้งเตือน', 'ชั้นเรียนนี้ยังไม่มีครูที่ปรึกษาในระบบ กรุณาติดต่อผู้ดูแลระบบ', 'warning'); return;
  }

  const subjects = [];
  for (let i = 0; i < subjectCount; i++) {
    if (!fd.get('code_' + i)) continue;
    subjects.push({
      order: fd.get('order_' + i),
      code: fd.get('code_' + i),
      name: fd.get('name_' + i),
      time: fd.get('time_' + i)
    });
  }
  if (subjects.length === 0) { Swal.fire('แจ้งเตือน', 'กรุณากรอกรายวิชาอย่างน้อย 1 รายการ', 'warning'); return; }

  Swal.fire({
    title: 'กำลังบันทึกข้อมูล...',
    html: 'กำลังบันทึกลง Google Sheet และอัปโหลดไฟล์ลายเซ็น',
    didOpen: () => Swal.showLoading(),
    allowOutsideClick: false
  });

  try {
    const req = {
      id: uid(),
      day: fd.get('day'), month: fd.get('month'), year: fd.get('year'),
      firstName: fd.get('firstName'), lastName: fd.get('lastName'),
      classId, className: cls.name,
      room: fd.get('room'), building: fd.get('building'), phone: fd.get('phone'),
      examType: fd.get('examType'), term: fd.get('term'), academicYear: fd.get('academicYear'),
      reason: fd.get('reason'), examDate: fd.get('examDate'),
      subjects,
      signatures: { student: sig, teacher: '', eval: '', deputy: '' },
      status: 'pending_teacher',
      teacherApproval: '', evalApproval: '', deputyApproval: '',
      teacherNote: '', evalNote: '', deputyNote: '',
      teacherName: '', evalName: '', deputyName: '',
      createdAt: Date.now()
    };

    await apiCall('saveRequest', { request: req });
    await DB.load();

    Swal.fire({
      icon: 'success',
      title: 'ส่งคำร้องสำเร็จ',
      html: `คำร้องถูกส่งไปยังครูที่ปรึกษาเรียบร้อยแล้ว<br><small class="text-gray-500">สถานะ: ${STAGE_INFO.pending_teacher.label}</small>`,
      confirmButtonColor: state.theme.primary
    }).then(() => {
      e.target.reset();
      initSubjects();
      document.getElementById('studentSigPreview').innerHTML = 'ยังไม่มีลายเซ็น';
      document.getElementById('sigNamePreview').textContent = '-';
      state.page = 'home';
      renderApp();
    });
  } catch (err) {
    Swal.fire('เกิดข้อผิดพลาดในการบันทึก', err.message, 'error');
  }
});

// ============================================================
// BIND PAGE EVENTS
// ============================================================
function bindPageEvents() {
  if (state.page === 'student') initSubjects();
}

// ============================================================
// BOOTSTRAP
// ============================================================
(async function boot() {
  applyTheme();
  state.loading = true;
  renderApp();
  try {
    await DB.load();
    state.theme = DB.get('theme', state.theme);
    applyTheme();
  } catch (e) {
    console.error('Boot loading error:', e);
    toast('error', 'เชื่อมต่อข้อมูลไม่สำเร็จ: ' + e.message);
  }
  state.loading = false;
  renderApp();
})();

</script>
